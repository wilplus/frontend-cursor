# willab upload proxy — see README.md in this directory for full setup.
#
# Deploy:   npx wrangler deploy          (from cloudflare/upload-proxy/)
# Dev:      npx wrangler dev
#
# Two deployment modes — pick ONE and set the FE's NEXT_PUBLIC_UPLOAD_PROXY_URL
# to match (unset = FE keeps using the Vercel BFF lane, nothing changes):
#
#   1. ROUTE mode (preferred; requires willpowerlab.com DNS on Cloudflare).
#      Same-origin: no CORS, no CSP change, auth cookies reach the Worker.
#      Uncomment `routes` + set PATH_PREFIX = "/cf-upload";
#      FE env: NEXT_PUBLIC_UPLOAD_PROXY_URL=https://willpowerlab.com/cf-upload
#
#   2. WORKERS.DEV / custom-subdomain mode (works without moving DNS).
#      Cross-origin: set ALLOWED_ORIGINS below; the FE adds the origin to its
#      CSP connect-src automatically from NEXT_PUBLIC_UPLOAD_PROXY_URL.
#      FE env: NEXT_PUBLIC_UPLOAD_PROXY_URL=https://willab-upload-proxy.<acct>.workers.dev

name = "willab-upload-proxy"
main = "src/worker.mjs"
compatibility_date = "2026-08-01"

# ROUTE mode only:
# routes = [
#   { pattern = "willpowerlab.com/cf-upload/*", zone_name = "willpowerlab.com" },
# ]

[vars]
# REQUIRED — the Railway backend's public origin (the Worker runs outside the
# Railway private network, so BACKEND_URL_INTERNAL does not apply here):
# BACKEND_ORIGIN = "https://<backend>.up.railway.app"

# Cross-origin mode only — exact origins, comma-separated:
# ALLOWED_ORIGINS = "https://willpowerlab.com,https://www.willpowerlab.com"

# ROUTE mode only — the prefix the route pattern carries:
# PATH_PREFIX = "/cf-upload"

# Must stay ABOVE the backend's SYNC_UPLOAD_DEADLINE_SECONDS (600s) so the
# backend's session_id-bearing 504 wins. Default 660000.
# UPSTREAM_TIMEOUT_MS = "660000"
