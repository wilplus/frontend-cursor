<div id="willab-decision-contract">
  <style>
    #willab-decision-contract{--ink:#121212;--muted:#f5f5f5;--sub:#737373;--line:#e9e9e9;--orange:#ff6a14;--green:#1f9d55;box-sizing:border-box;width:min(100%,760px);min-height:650px;margin:0 auto;border:1px solid var(--line);border-radius:22px;background:#fff;color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;box-shadow:0 18px 60px rgba(0,0,0,.08);overflow:hidden}
    #willab-decision-contract *{box-sizing:border-box}#willab-decision-contract button{font:inherit;border:0;cursor:pointer;color:inherit;background:transparent}#willab-decision-contract button:active{opacity:.7;transform:scale(.985)}
    .dc-head{padding:22px 24px 18px;border-bottom:1px solid var(--line)}.dc-kicker{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--orange)}.dc-head h1{margin:7px 0 5px;font-size:25px;letter-spacing:-.04em}.dc-head p{margin:0;max-width:650px;font-size:14px;line-height:1.45;color:var(--sub)}
    .dc-progress{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line)}.dc-track{height:7px;flex:1;border-radius:99px;background:var(--muted);overflow:hidden}.dc-fill{height:100%;border-radius:99px;background:var(--orange);transition:width .2s}.dc-progress span{min-width:78px;font-size:12px;color:var(--sub);text-align:right}
    .dc-body{padding:30px 24px 26px}.dc-section{font-size:12px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.08em}.dc-question{margin:9px 0 10px;font-size:25px;line-height:1.15;letter-spacing:-.035em}.dc-why{margin:0 0 22px;padding:12px 14px;border-radius:13px;background:#fff8f3;font-size:13px;line-height:1.45;color:#684027}.dc-why strong{color:var(--orange)}
    .dc-options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.dc-option{min-height:148px;padding:17px;border:1px solid var(--line);border-radius:16px;text-align:left;transition:.15s}.dc-option:hover{border-color:#c9c9c9;background:#fcfcfc}.dc-option.recommended{border:2px solid var(--orange);padding:16px}.dc-option.selected{border-color:var(--green);box-shadow:0 0 0 3px rgba(31,157,85,.12)}.dc-option-head{display:flex;align-items:flex-start;justify-content:space-between;gap:9px}.dc-option strong{font-size:16px;line-height:1.2}.dc-option em{font-size:10px;font-style:normal;font-weight:800;letter-spacing:.06em;color:var(--orange);white-space:nowrap}.dc-option p{margin:10px 0 0;font-size:13px;line-height:1.45;color:var(--sub)}
    .dc-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:17px 24px;border-top:1px solid var(--line)}.dc-back,.dc-reset{font-size:13px;color:var(--sub)}.dc-back:disabled{opacity:.35;cursor:default}.dc-auto{margin-left:auto;font-size:12px;color:var(--sub)}.dc-hidden{display:none!important}
    .dc-summary{padding:26px 24px}.dc-summary h2{margin:0 0 7px;font-size:25px;letter-spacing:-.04em}.dc-summary>p{margin:0 0 19px;color:var(--sub);font-size:14px;line-height:1.45}.dc-contract{display:grid;gap:8px}.dc-contract-row{display:grid;grid-template-columns:36% 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line);font-size:13px}.dc-contract-row b{font-size:12px;color:var(--sub)}.dc-contract-row span{line-height:1.4}.dc-summary-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:22px}.dc-summary-actions button{min-height:40px;border-radius:999px;padding:0 15px;font-size:13px;font-weight:700}.dc-copy{background:var(--ink)!important;color:#fff!important}.dc-start{border:1px solid var(--line)!important}.dc-copy-fallback{display:block;width:100%;min-height:170px;margin-top:12px;border:1px solid var(--line);border-radius:13px;background:#fafafa;padding:12px;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;resize:vertical}.dc-note{margin-top:15px;padding:12px 14px;border-radius:13px;background:#f0faf4;color:#176b3a;font-size:13px;line-height:1.4}
    @media(max-width:560px){#willab-decision-contract{border-radius:0;border-left:0;border-right:0}.dc-head,.dc-progress,.dc-body,.dc-foot,.dc-summary{padding-left:18px;padding-right:18px}.dc-options{grid-template-columns:1fr}.dc-option{min-height:0}.dc-question{font-size:23px}.dc-contract-row{grid-template-columns:1fr;gap:4px}}
  </style>
  <header class="dc-head"><div class="dc-kicker">WillpowerLab · decision contract</div><h1>Project chat + continue where you left off</h1><p>One binary decision at a time. The orange option is my recommendation. Your answer is saved in this artifact; after the last decision, press <b>Done</b> to lock the contract.</p></header>
  <div class="dc-progress"><div class="dc-track"><div class="dc-fill" id="dc-fill"></div></div><span id="dc-count"></span></div>
  <main id="dc-main"></main>
  <footer class="dc-foot" id="dc-foot"><button class="dc-back" id="dc-back" type="button">← Back</button><button class="dc-reset" id="dc-reset" type="button">Reset answers</button><span class="dc-auto">Answer saves · next question opens automatically</span></footer>
  <script>
    (()=>{
      const root=document.getElementById('willab-decision-contract');if(!root)return;
      const main=document.getElementById('dc-main'),fill=document.getElementById('dc-fill'),count=document.getElementById('dc-count'),back=document.getElementById('dc-back'),reset=document.getElementById('dc-reset'),foot=document.getElementById('dc-foot');
      const key='willab-project-chat-decision-contract-v2';
      const qs=[
        {section:'First principle · identity',id:'chat_identity',q:'What is a project chat?',why:'A project needs a stable identity so it can be reopened without creating a new conversation.',rec:'A persistent chat with its own ID, history, context and training state.',alt:'A temporary training session attached to the main Will chat.',recLabel:'Persistent chat',altLabel:'Temporary session'},
        {section:'First principle · creation',id:'creation_entry',q:'Where should a user create a project?',why:'Keeping creation in the main chat gives the product one obvious home and keeps the list simple.',rec:'From the main Will chat using “Start a new project”.',alt:'From a separate Projects screen or navigation area.',recLabel:'From Will',altLabel:'Separate screen'},
        {section:'First principle · context',id:'initial_context',q:'What should a new project inherit?',why:'Independent context prevents one project from contaminating another and makes resume predictable.',rec:'Only the project setup and the user’s new project messages.',alt:'The complete history and memory of the main Will chat.',recLabel:'Independent context',altLabel:'Copy Will context',locked:true,lockedValue:'recommended'},
        {section:'First principle · naming',id:'project_naming',q:'How should the project be named?',why:'A useful name makes the chat list a reliable return point.',rec:'Ask for a name before creating the project; allow rename later.',alt:'Create immediately with an automatic title and never ask for a name.',recLabel:'Name first',altLabel:'Auto-title'},
        {section:'First principle · multiplicity',id:'many_projects',q:'How many projects can one user have?',why:'Projects are the user’s durable workspaces; an artificial limit would make the chat list unreliable.',rec:'Any number, with the list ordered by recent activity below pinned Will.',alt:'Only one active project at a time.',recLabel:'Unlimited projects',altLabel:'One active project'},
        {section:'First principle · resume',id:'resume_checkpoint',q:'Where should Continue resume?',why:'Exact checkpointing is the core promise: the user should not need to remember where they stopped.',rec:'At the exact last saved checkpoint, including slide, intervention and current step.',alt:'At the beginning of the last unfinished slide.',recLabel:'Exact checkpoint',altLabel:'Slide start'},
        {section:'First principle · persistence',id:'leave_behavior',q:'What happens if the user simply leaves or closes the app?',why:'A project should be safe even if the user forgets to press Pause.',rec:'Auto-save the latest valid checkpoint; leaving equals paused, not lost.',alt:'Save only when the user explicitly presses Pause.',recLabel:'Auto-save',altLabel:'Explicit Pause only'},
        {section:'First principle · save cadence',id:'save_cadence',q:'When should the checkpoint be saved?',why:'Saving after every meaningful step protects progress without storing every transient UI event.',rec:'After each completed answer/intervention and when the app backgrounds or closes.',alt:'Only when the entire timed session ends.',recLabel:'Meaningful-step save',altLabel:'End-of-session save'},
        {section:'First principle · moment',id:'meaningful_moment',q:'What should count as a meaningful moment?',why:'The checkpoint must match the product’s actual feedback unit, not every low-level detector event.',rec:'One completed Lenses feedback moment/card — praise or practice/correction — attached to its passage block. Save after its processing and user-visible answer are settled, not for every raw detector event.',alt:'Any machine-detected event, even when it never becomes a Lenses feedback card or user-visible intervention.',recLabel:'Lenses feedback moment',altLabel:'Every detector event'},
        {section:'First principle · processing',id:'processing_questions',q:'What happens while a Take is processing?',why:'Short sessions should feel continuous: the user can keep contributing while the system prepares the next feedback.',rec:'Keep the user in the project chat, ask content questions there, save each answer, and let processing continue in parallel.',alt:'Show a blocking processing screen and ask questions only after processing finishes.',recLabel:'Questions in parallel',altLabel:'Wait first',locked:true,lockedValue:'recommended'},
        {section:'First principle · time',id:'training_time',q:'What does “5 minutes” measure?',why:'Active practice time is the only measure that stays fair when a user pauses or loses connection.',rec:'Active training time only; paused and background time do not count.',alt:'Wall-clock time from Start until the session ends.',recLabel:'Active time',altLabel:'Wall-clock time'},
        {section:'First principle · sessions',id:'multiple_sessions',q:'Can one project contain multiple training sessions?',why:'A project should be a durable goal, not a single disposable attempt.',rec:'Yes. Keep the project history and add resumable sessions/checkpoints; a project will commonly contain many short sessions.',alt:'No. Completing or pausing ends the project permanently.',recLabel:'Multiple sessions',altLabel:'One session',locked:true,lockedValue:'recommended'},
        {section:'First principle · completion',id:'after_completion',q:'What happens after the chosen training duration is completed?',why:'Completion should not destroy the ability to practise the same project again.',rec:'Mark the session complete but keep the project open for another session.',alt:'Lock the project and require a new project for more practice.',recLabel:'Reopenable project',altLabel:'Lock after completion'},
        {section:'First principle · ordering',id:'list_order',q:'How should project chats be ordered?',why:'Recent activity makes returning to the right project fast while Will remains a stable anchor.',rec:'Will stays pinned; projects below it sort by most recent activity.',alt:'Projects stay permanently in creation order.',recLabel:'Recent activity',altLabel:'Creation order'},
        {section:'First principle · switching',id:'return_route',q:'What should happen when the user returns to the app?',why:'Automatic routing should never hide the list or take the user into an unexpected project.',rec:'Show the chat list first; the user chooses Will or a project.',alt:'Automatically open the last active project.',recLabel:'List first',altLabel:'Auto-open last'},
        {section:'First principle · access',id:'project_privacy',q:'Who can access a project chat?',why:'Projects may contain personal training history and should not become shareable by accident.',rec:'Private to its owner by default; sharing is a separate future decision.',alt:'Every project is shareable through the same public link as Will.',recLabel:'Private by default',altLabel:'Shareable by default'},
        {section:'First principle · public link',id:'public_link',q:'What should the existing public link open?',why:'This protects the current hardcoded Speaking Coach while the builder is still experimental.',rec:'Always open the hardcoded Will chat; never route it to a user-built coach yet.',alt:'Open the visitor’s or owner’s configured Chat Builder coach.',recLabel:'Hardcoded Will',altLabel:'Builder coach',locked:true,lockedValue:'recommended'},
        {section:'First principle · audio',id:'audio_scope',q:'Where should AI Audio work in this phase?',why:'The first production proof should stay narrow so we can verify ElevenLabs without changing project behavior.',rec:'Hardcoded Will first; project-chat audio comes after the core resume flow is proven.',alt:'Enable AI Audio equally in every project from day one.',recLabel:'Will first',altLabel:'All chats now'},
        {section:'First principle · source of truth',id:'state_authority',q:'Where is the project state authoritative?',why:'One server checkpoint prevents different devices or browser tabs from disagreeing.',rec:'Backend is authoritative; frontend shows cached state and sync status.',alt:'Browser local storage is authoritative.',recLabel:'Backend truth',altLabel:'Browser truth'},
        {section:'First principle · failure',id:'offline_behavior',q:'What should happen after a failed save?',why:'Silent loss would break trust in Continue; the user needs a visible recovery path.',rec:'Show “Not saved”, keep the local pending checkpoint, and retry when online.',alt:'Discard the unsaved checkpoint and continue silently.',recLabel:'Retry visibly',altLabel:'Discard silently'},
        {section:'First principle · deletion',id:'deletion',q:'How should a project be removed?',why:'The main Will chat is protected; project rows should feel familiar and reversible like WhatsApp.',rec:'Projects expose Archive and Delete actions: swipe on mobile, equivalent row action/menu on web. The main Will chat has neither action.',alt:'Only offer a hidden settings flow, or make projects impossible to remove.',recLabel:'WhatsApp-style actions',altLabel:'Settings-only'},
        {section:'First principle · Will context',id:'will_cross_project_access',q:'Can Will use context from every project?',why:'The main Will chat is the user’s cross-project intelligence layer, while each project remains contextually independent.',rec:'Yes. Will can read all project contexts and derive general speaking patterns, efficiency findings and interventions, while each project keeps its own local context.',alt:'No. Will may only use messages from the main chat.',recLabel:'Cross-project Will',altLabel:'Will-only context',locked:true,lockedValue:'recommended'},
        {section:'First principle · Will output',id:'will_findings_surface',q:'How should cross-project findings appear?',why:'Global findings are useful only if the user can trace them back to the project evidence without mixing project conversations together.',rec:'Will shows a general findings layer with patterns, interventions and links/references to the source projects; each project shows its own specific insights and can link back to Will.',alt:'Blend global and project findings into every chat without source references.',recLabel:'Linked findings',altLabel:'Blend everything'},
        {section:'First principle · processing memory',id:'processing_question_memory',q:'Where should answers to processing questions live?',why:'Questions asked while processing must remain part of the project’s reasoning trail and later be available to Will’s cross-project synthesis.',rec:'Save them as ordinary project-chat messages, tagged as processing questions, and include them in project summaries and Will’s cross-project context.',alt:'Keep them as temporary hidden form answers that never appear in chat history.',recLabel:'Visible project record',altLabel:'Hidden temporary data'},
        {section:'First principle · acceptance',id:'prototype_acceptance',q:'What must the next clickable prototype prove?',why:'A build should not start until the complete user journey is visually unambiguous.',rec:'Create → name → open → choose duration → train → answer processing questions → pause → leave → reopen → resume exact checkpoint.',alt:'Only show the list and the open project chat.',recLabel:'Full journey',altLabel:'List + chat only'}
      ];
      let saved={answers:{},index:0,done:false};try{saved={...saved,...JSON.parse(localStorage.getItem(key)||'{}')};saved.answers=saved.answers||{}}catch{}
      qs.forEach(q=>{if(q.locked)saved.answers[q.id]=q.lockedValue});
      const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const openIndices=()=>qs.map((q,i)=>q.locked?-1:i).filter(i=>i>=0);
      const activeIndex=()=>{const open=openIndices();return open.find(i=>i>=saved.index) ?? open[open.length-1]};
      const nextOpen=(i)=>openIndices().find(n=>n>i);
      const prevOpen=(i)=>openIndices().reverse().find(n=>n<i);
      function persist(){try{localStorage.setItem(key,JSON.stringify(saved))}catch{}}
      function option(q,value,label,text,recommended){return `<button class="dc-option ${recommended?'recommended':''} ${saved.answers[q.id]===value?'selected':''}" data-answer="${value}" type="button"><span class="dc-option-head"><strong>${esc(label)}</strong>${recommended?'<em>RECOMMENDED</em>':''}</span><p>${esc(text)}</p></button>`}
      function render(){
        if(saved.done){renderSummary();return}
        const q=qs[activeIndex()],open=openIndices(),position=open.indexOf(activeIndex());fill.style.width=`${Math.round((position/open.length)*100)}%`;count.textContent=`${position+1} of ${open.length}`;back.disabled=position===0;
        main.innerHTML=`<section class="dc-body"><div class="dc-section">${esc(q.section)}</div><h2 class="dc-question">${esc(q.q)}</h2><p class="dc-why"><strong>My recommendation:</strong> ${esc(q.why)}</p><div class="dc-options">${option(q,'recommended',q.recLabel,q.rec,true)}${option(q,'alternative',q.altLabel,q.alt,false)}</div></section>`;
        main.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{saved.answers[q.id]=b.dataset.answer;const nextIndex=nextOpen(activeIndex());if(nextIndex===undefined){saved.done=true}else{saved.index=nextIndex}persist();render()}));
      }
      function renderSummary(){
        fill.style.width='100%';count.textContent='Complete';foot.classList.add('dc-hidden');
        const rows=qs.map(q=>`<div class="dc-contract-row"><b>${esc(q.section.replace('First principle · ',''))}${q.locked?' · locked':''}</b><span>${saved.answers[q.id]==='recommended'?esc(q.rec):esc(q.alt)}</span></div>`).join('');
        const contractText=qs.map(q=>`${q.section}: ${saved.answers[q.id]==='recommended'?q.rec:q.alt}`).join('\n');
        main.innerHTML=`<section class="dc-summary"><h2>Contract ready for review</h2><p>All decisions are saved in this artifact. Press <b>Done</b> here, then tell me in the chat that you are done. I will turn this contract into the implementation plan and only then spawn workers after your green light.</p><div class="dc-contract">${rows}</div><div class="dc-summary-actions"><button class="dc-copy" id="dc-copy" type="button">Copy answers</button><button class="dc-start" id="dc-start" type="button">Edit answers</button></div><div class="dc-note">Next step after your confirmation: I will restate the contract, identify any contradictions, and show the exact app changes before any build begins.</div></section>`;
        const copyButton=document.getElementById('dc-copy');
        const showFallback=()=>{let area=main.querySelector('.dc-copy-fallback');if(!area){area=document.createElement('textarea');area.className='dc-copy-fallback';area.readOnly=true;area.setAttribute('aria-label','Answers to copy');main.querySelector('.dc-summary-actions').after(area)}area.value=contractText;area.focus();area.select();copyButton.textContent='Text selected';};
        copyButton.addEventListener('click',async()=>{let copied=false;try{if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(contractText).then(()=>{copied=true})}catch{}if(!copied){try{const area=document.createElement('textarea');area.value=contractText;area.setAttribute('readonly','');area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.focus();area.select();copied=document.execCommand('copy');area.remove()}catch{copied=false}}if(copied){copyButton.textContent='Copied'}else{showFallback()}});
        document.getElementById('dc-start').addEventListener('click',()=>{saved.done=false;saved.index=0;persist();render()})
      }
      back.addEventListener('click',()=>{const previous=prevOpen(activeIndex());if(previous!==undefined){saved.index=previous;persist();render()}});
      reset.addEventListener('click',()=>{saved={answers:{},index:0,done:false};qs.forEach(q=>{if(q.locked)saved.answers[q.id]=q.lockedValue});persist();render()});
      render();
    })();
  </script>
</div>
