}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);

.form-check-input[type=&quot;radio&quot;]:checked {

}

  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {

  height: 20px;

  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {

  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;

  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));

  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);

  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;

.form-range::-webkit-slider-runnable-track {
  height: 28px;

  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);

}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

        mic: &#x27;&lt;svg width=&quot;20&quot; height=&quot;20&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.8&quot;&gt;&lt;rect x=&quot;8&quot; y=&quot;2&quot; width=&quot;8&quot; height=&quot;13&quot; rx=&quot;4&quot;/&gt;&lt;path d=&quot;M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8&quot;/&gt;&lt;/svg&gt;&#x27;,
        send: &#x27;&lt;svg width=&quot;20&quot; height=&quot;20&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.8&quot;&gt;&lt;path d=&quot;m22 2-7 20-4-9-9-4Z&quot;/&gt;&lt;path d=&quot;M22 2 11 13&quot;/&gt;&lt;/svg&gt;&#x27;,
        play: &#x27;&lt;svg width=&quot;15&quot; height=&quot;15&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;currentColor&quot;&gt;&lt;path d=&quot;m8 5 11 7-11 7V5Z&quot;/&gt;&lt;/svg&gt;&#x27;,
        pause: &#x27;&lt;svg width=&quot;15&quot; height=&quot;15&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;currentColor&quot;&gt;&lt;path d=&quot;M7 5h3v14H7zM14 5h3v14h-3z&quot;/&gt;&lt;/svg&gt;&#x27;,

        arrow: &#x27;&lt;svg width=&quot;17&quot; height=&quot;17&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;&gt;&lt;path d=&quot;m9 18 6-6-6-6&quot;/&gt;&lt;/svg&gt;&#x27;,
        x: &#x27;&lt;svg width=&quot;20&quot; height=&quot;20&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;&gt;&lt;path d=&quot;m6 6 12 12M18 6 6 18&quot;/&gt;&lt;/svg&gt;&#x27;
      };

      const chats = [
        { id: &quot;project-2&quot;, title: &quot;Board meeting&quot;, subtitle: &quot;Project chat&quot;, preview: &quot;Not started&quot;, time: &quot;New&quot;, letter: &quot;B&quot;, paused: false },
        { id: &quot;project-1&quot;, title: &quot;Investor talk&quot;, subtitle: &quot;Project chat&quot;, preview: &quot;Paused at slide 3 · 5 minutes&quot;, time: &quot;Now&quot;, letter: &quot;I&quot;, paused: true },
      ];
      let current = &quot;will&quot;;
      let overlayState = null;
      let playing = false;
      let selectedDuration = null;
      let training = &quot;paused&quot;;
      let newProjectCount = 0;

      const mark = (chat) =&gt; chat.id === &quot;will&quot;
        ? &#x27;&lt;span class=&quot;wlp-will-mark&quot; aria-hidden&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;/span&gt;&#x27;
        : `&lt;span class=&quot;wlp-project-mark&quot; aria-hidden&gt;${chat.letter}&lt;/span&gt;`;

      function chatRow(chat) {
        const selected = current === chat.id ? &quot; is-selected&quot; : &quot;&quot;;

            &lt;span class=&quot;wlp-chat-line&quot;&gt;&lt;strong class=&quot;wlp-chat-title&quot;&gt;${chat.title}&lt;/strong&gt;&lt;span class=&quot;wlp-chat-subtitle&quot;&gt;${subtitle}&lt;/span&gt;&lt;span class=&quot;wlp-chat-time&quot;&gt;${chat.time || &quot;&quot;}&lt;/span&gt;&lt;/span&gt;
            &lt;span class=&quot;wlp-chat-preview&quot;&gt;${preview}&lt;/span&gt;
          &lt;/span&gt;
          ${chat.id === &quot;will&quot; ? `&lt;span class=&quot;wlp-pin&quot; title=&quot;Pinned&quot;&gt;${icons.pin}&lt;/span&gt;` : &quot;&quot;}

      }

      function renderList() {
        list.innerHTML = chatRow({ id: &quot;will&quot;, title: &quot;Will&quot;, time: &quot;&quot;, preview: &quot;AI audio is ready&quot; }) + chats.map(chatRow).join(&quot;&quot;);

      function topbar(title, subtitle) {
        return `&lt;header class=&quot;wlp-topbar&quot;&gt;&lt;button class=&quot;wlp-back&quot; type=&quot;button&quot; data-back aria-label=&quot;Back&quot;&gt;${icons.back}&lt;/button&gt;${mark({ id: title === &quot;Will&quot; ? &quot;will&quot; : &quot;project&quot;, title, letter: title[0] })}&lt;span class=&quot;wlp-top-title&quot;&gt;&lt;strong&gt;${title}&lt;/strong&gt;&lt;span&gt;${subtitle}&lt;/span&gt;&lt;/span&gt;&lt;/header&gt;`;

      function willChat() {
        return `${topbar(&quot;Will&quot;, &quot;Speaking Coach · hardcoded&quot;)}

      function listView() {

      function openProjectSheet() {

        overlay.innerHTML = `&lt;div class=&quot;wlp-sheet-backdrop&quot; data-close-overlay&gt;&lt;div class=&quot;wlp-sheet&quot; role=&quot;dialog&quot; aria-label=&quot;Your projects&quot; data-stop-close&gt;&lt;div class=&quot;wlp-grabber&quot;&gt;&lt;/div&gt;&lt;h2&gt;Your projects&lt;/h2&gt;&lt;p&gt;Open a project chat or start a new one. The main chat stays pinned above them.&lt;/p&gt;${chats.map((chat) =&gt; `&lt;button class=&quot;wlp-sheet-option&quot; type=&quot;button&quot; data-sheet-project=&quot;${chat.id}&quot;&gt;&lt;span&gt;&lt;strong&gt;${chat.title}&lt;/strong&gt;&lt;span&gt;${chat.preview}&lt;/span&gt;&lt;/span&gt;${icons.arrow}&lt;/button&gt;`).join(&quot;&quot;)}&lt;button class=&quot;wlp-sheet-option&quot; type=&quot;button&quot; data-sheet-new&gt;&lt;span&gt;&lt;strong&gt;Start a new project&lt;/strong&gt;&lt;span&gt;A new project becomes a new chat below Will&lt;/span&gt;&lt;/span&gt;${icons.arrow}&lt;/button&gt;&lt;div class=&quot;wlp-sheet-footer&quot;&gt;&lt;button class=&quot;wlp-button outline&quot; type=&quot;button&quot; data-close-button&gt;Cancel&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`;

      function openDurationSheet() {

        overlay.querySelector(&quot;[data-stop-close]&quot;)?.addEventListener(&quot;click&quot;, (event) =&gt; event.stopPropagation());
        overlay.querySelectorAll(&quot;[data-close-overlay], [data-close-button]&quot;).forEach((el) =&gt; el.addEventListener(&quot;click&quot;, closeOverlay));
        overlay.querySelectorAll(&quot;[data-duration]&quot;).forEach((el) =&gt; el.addEventListener(&quot;click&quot;, () =&gt; { selectedDuration = el.getAttribute(&quot;data-duration&quot;); training = &quot;active&quot;; chats.find((chat) =&gt; chat.id === current).preview = `Training · ${selectedDuration}`; closeOverlay(); render(); }));
      }

      function closeOverlay() { overlayState = null; overlay.innerHTML = &quot;&quot;; }
      addProject.addEventListener(&quot;click&quot;, openCreateSheet);
      current = &quot;list&quot;;
      render();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
