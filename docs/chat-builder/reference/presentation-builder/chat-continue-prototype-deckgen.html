        const rec = deckSpeech;
        deckSpeech = null;
        rec?.stop?.();
        let text = `${v.final} ${v.interim}`.trim();
        if (v.simulated && action === "send" && !v.done) text = deckSampleSpeechFull(v) || text;
        deck.voice = null;
        text = deckCap(text);
        if (action === "cancel" || !text) { deck.draft = ""; renderDeck(); return; }
        if (action === "send") { deck.draft = ""; deckSubmit(text, true); return; }
        deck.draft = text;
        renderDeck({ focus: true });
      }
      // A hold released before the simulated words finished still sends the
      // whole sentence (a real recogniser would have heard it).
      function deckSampleSpeechFull(v) { return v.full || ""; }

      function deckUploadInput() {
        let input = root.querySelector("#wlp-deck-upload");
        if (input) return input;
        input = document.createElement("input");
        input.type = "file";
        input.accept = "image/*";
        input.id = "wlp-deck-upload";
        input.hidden = true;
        root.appendChild(input);
        input.addEventListener("change", () => {
          const file = input.files?.[0];
          input.value = "";
          if (!file || !deck) return;
          const url = URL.createObjectURL(file);
          const apply = () => {
            if (!deck) return;
            if (deck.busy) { deckLater(apply, 150); return; }
            const index = Math.min(deck.slides.length - 1, Math.max(0, deck.uploadTarget ?? 0));
            const target = deck.slides[index];
            deckCheckpoint(`your photo on slide ${index + 1}`);
            target.upload = url;
            deckSay("me", `📎 ${escapeHtml(file.name)}`);
            deck.minor.style += 1;
            deck.touched = [target.id];
            if (deck.phase === "final") deck.final = { slides: deckClone(deck.slides), style: deckClone(deck.style) };
            deckRun([{ html: `Your photo is on ${deckSlideName(index)}, full-bleed with the title over it. Say ${deckPhrase("move the photo to slide 3")} to put it elsewhere. That's ${deckVersionTag()}.`, wait: 350 }], "touched");
          };
          apply();
        });
        return input;
      }

      function bindDeck() {
        overlay.querySelectorAll("[data-deck-close]").forEach((button) => button.addEventListener("click", closeDeckBuilder));
        overlay.querySelectorAll("[data-deck-step]").forEach((button) => button.addEventListener("click", () => {
          const key = button.getAttribute("data-deck-step");
          deckSubmit(key === "structure" ? "Back to the plan" : key === "visuals" ? "Back to the visuals" : "Back to the style", false);
        }));
        overlay.querySelectorAll("[data-deck-open-version]").forEach((button) => button.addEventListener("click", () => { deck.viewer = { versionId: button.getAttribute("data-deck-open-version"), index: 0 }; renderDeck(); }));
        overlay.querySelectorAll("[data-deck-practice]").forEach((button) => button.addEventListener("click", () => { deckSay("me", "Practise it"); practiceGeneratedDeck(); }));
        overlay.querySelector("[data-deck-pick-cancel]")?.addEventListener("click", () => { deck.picked = null; renderDeck(); });
        overlay.querySelectorAll("[data-deck-slot]").forEach((button) => button.addEventListener("click", () => {
          const k = Number(button.getAttribute("data-deck-slot"));
          const from = deck.picked;
          if (from === null) return;
          deck.picked = null;
          deckMove(from, k > from ? k - 1 : k);
          renderDeck();
        }));
        overlay.querySelectorAll("[data-deck-select]").forEach((button) => button.addEventListener("click", () => {
          const slide = deck.slides[Number(button.getAttribute("data-deck-select"))];
          if (!slide || deck.busy) return;
          deck.selected = deck.selected === slide.id ? null : slide.id;
          renderDeck({ focus: Boolean(deck.selected) && window.matchMedia?.("(pointer: fine)").matches });
        }));
        overlay.querySelectorAll("[data-deck-zoom]").forEach((button) => button.addEventListener("click", (event) => { event.stopPropagation(); deck.viewer = { versionId: null, index: Number(button.getAttribute("data-deck-zoom")) }; renderDeck(); }));
        overlay.querySelectorAll("[data-deck-look]").forEach((button) => button.addEventListener("click", () => {
          const theme = button.getAttribute("data-deck-look");
          if (deck.busy) deckStop("voice");
          deckSay("me", `The ${escapeHtml(deckThemes[theme].label)} look`);
          deck.touched = [];
          deck.toast = "";
          deckPickLook(theme);
        }));
        overlay.querySelectorAll("[data-deck-edit]").forEach((field) => {
          let before = "";
          let snap = null;
          const key = field.getAttribute("data-deck-edit");
          const index = Number(field.getAttribute("data-deck-index"));
          field.addEventListener("focus", () => { before = field.textContent; snap = { slides: deckClone(deck.slides), style: deckClone(deck.style), minor: deckClone(deck.minor), chosenLook: deck.chosenLook }; });
          field.addEventListener("input", () => { const slide = deck.slides[index]; if (slide) slide[key] = field.textContent.replace(/\s+/g, " ").trim(); });
          field.addEventListener("paste", (event) => { event.preventDefault(); document.execCommand("insertText", false, (event.clipboardData?.getData("text/plain") || "").replace(/\s+/g, " ")); });
          field.addEventListener("keydown", (event) => {
            if (event.key === "Enter") { event.preventDefault(); field.blur(); }
            if (event.key === "Escape") { event.preventDefault(); field.textContent = before; field.dispatchEvent(new Event("input")); field.blur(); }
          });
          field.addEventListener("blur", () => {
            const slide = deck.slides[index];
            if (!slide) return;
            if (!field.textContent.trim()) { field.textContent = before; slide[key] = before.trim(); return; }
            if (field.textContent === before || !snap) return;
            deck.history.push({ label: `edited slide ${index + 1}`, phase: deck.phase, ...snap });
            deck.minor.structure += 1;
            deck.touched = [slide.id];
            deckRefreshDock();
            overlay.querySelectorAll('[data-deck-ver="structure"]').forEach((el) => { el.textContent = deckVersion("structure"); });
          });
        });
        overlay.querySelectorAll("[data-deck-grip]").forEach((grip) => grip.addEventListener("pointerdown", (event) => startDeckDrag(event, grip)));
      }

      // Drag the grip to reorder; a plain tap on the grip enters tap-to-place.
      function startDeckDrag(event, grip) {
        if (deck.busy || event.button > 0) return;
        event.preventDefault();
        const thread = overlay.querySelector(".wlp-deck-thread");
        const from = Number(grip.getAttribute("data-deck-grip"));
        const cards = [...overlay.querySelectorAll("[data-deck-card]")];
        const card = cards[from];
        if (!card) return;
        const rects = cards.map((item) => item.getBoundingClientRect());
        const startScroll = thread ? thread.scrollTop : 0;
        const startY = event.clientY;
        const step = rects.length > 1 ? Math.abs(rects[1].top - rects[0].top) : rects[from].height + 12;
        let dragging = false;
        let target = from;
        try { grip.setPointerCapture(event.pointerId); } catch (error) { /* synthetic pointer */ }
        const move = (moveEvent) => {
          if (thread && dragging) {
            const box = thread.getBoundingClientRect();
            if (moveEvent.clientY < box.top + 40) thread.scrollTop -= 12;
            else if (moveEvent.clientY > box.bottom - 40) thread.scrollTop += 12;
          }
          const dy = moveEvent.clientY - startY + ((thread ? thread.scrollTop : 0) - startScroll);
          if (!dragging && Math.abs(dy) < 6) return;
          dragging = true;
          card.classList.add("is-dragging");
          card.style.transform = `translateY(${dy}px)`;
          const y = rects[from].top + rects[from].height / 2 + dy;
          target = rects.filter((rect, i) => i !== from && rect.top + rect.height / 2 < y).length;
          cards.forEach((item, i) => {
            if (i === from) return;
            const shift = from < i && i <= target ? -step : target <= i && i < from ? step : 0;
            item.style.transform = shift ? `translateY(${shift}px)` : "";
          });
        };
        const finish = () => {
          grip.removeEventListener("pointermove", move);
          grip.removeEventListener("pointerup", finish);
          grip.removeEventListener("pointercancel", finish);
          if (dragging) { if (target !== from) deckMove(from, target); }
          else deck.picked = deck.picked === from ? null : from;
          renderDeck();
        };
        grip.addEventListener("pointermove", move);
        grip.addEventListener("pointerup", finish);
        grip.addEventListener("pointercancel", finish);
      }

      function deckViewerGo(index) {
        const { slides } = deckViewerData();
        const next = Math.max(0, Math.min(slides.length - 1, index));
        const dir = Math.sign(next - deck.viewer.index);
        if (!dir) return;
        deck.viewer.index = next;
        renderDeck();
        const active = overlay.querySelector(".wlp-deck-thumbs .is-active");
        const strip = overlay.querySelector(".wlp-deck-thumbs");
        if (active && strip) strip.scrollLeft = active.offsetLeft - strip.clientWidth / 2 + active.clientWidth / 2;
        if (!deckReducedMotion()) overlay.querySelector(".wlp-deck-viewer-slide")?.animate([{ opacity: 0, transform: `translateX(${dir * 36}px)` }, { opacity: 1, transform: "none" }], { duration: 400, easing: "cubic-bezier(.2,.8,.2,1)" });
      }
      function deckViewerCommand(text, voice) {
        const lower = text.toLowerCase().trim().replace(/[.!]+$/, "");
        const norm = deckNormalize(text);
        deck.draft = "";
        const slideMatch = norm.match(/^(?:go to |show |open |jump to )?slide\s*(\d+)$/);
        if (/^(next|forward|go on|keep going|next slide)$/.test(lower)) { deckViewerGo(deck.viewer.index + 1); return; }
        if (/^(prev|previous|go back one|last one|previous slide)$/.test(lower)) { deckViewerGo(deck.viewer.index - 1); return; }
        if (slideMatch) { deckViewerGo(Number(slideMatch[1]) - 1); return; }
        if (/^(back|close|exit|edit|keep tweaking|builder)$/.test(lower)) { deck.viewer = null; renderDeck({ scroll: "bottom" }); return; }
        // Anything else is an edit to the slide on screen.
        const { version } = deckViewerData();
        const editable = deck.phase !== "brief" && deck.phase !== "structure" && (!version || version.pass === "final");
        if (editable && deck.slides[deck.viewer.index]) deck.selected = deck.slides[deck.viewer.index].id;
        deck.viewer = null;
        deckSubmit(text, voice);
      }
      function bindDeckViewer() {
        overlay.querySelectorAll("[data-deck-viewer-close]").forEach((button) => button.addEventListener("click", () => { deck.viewer = null; renderDeck({ scroll: "bottom" }); }));
        overlay.querySelector("[data-deck-viewer-prev]")?.addEventListener("click", () => deckViewerGo(deck.viewer.index - 1));
        overlay.querySelector("[data-deck-viewer-next]")?.addEventListener("click", () => deckViewerGo(deck.viewer.index + 1));
        overlay.querySelectorAll("[data-deck-viewer-go]").forEach((button) => button.addEventListener("click", () => deckViewerGo(Number(button.getAttribute("data-deck-viewer-go")))));
        overlay.querySelectorAll("[data-deck-practice]").forEach((button) => button.addEventListener("click", () => { deck.viewer = null; deckSay("me", "Practise it"); practiceGeneratedDeck(); }));
        const swipe = overlay.querySelector("[data-deck-swipe]");
        let startX = null;
        swipe?.addEventListener("pointerdown", (event) => { startX = event.clientX; });
        swipe?.addEventListener("pointerup", (event) => { if (startX === null) return; const dx = event.clientX - startX; startX = null; if (Math.abs(dx) > 40) deckViewerGo(deck.viewer.index + (dx < 0 ? 1 : -1)); });
      }
      document.addEventListener("keydown", (event) => {
        if (overlayState !== "deckgen" || !deck) return;
        if (event.key === "Escape" && deck.voice) { deckVoiceEnd("cancel"); return; }
        if (!deck.viewer || document.activeElement?.id === "wlp-deck-input") return;
        if (event.key === "ArrowRight") deckViewerGo(deck.viewer.index + 1);
        if (event.key === "ArrowLeft") deckViewerGo(deck.viewer.index - 1);
        if (event.key === "Escape") { deck.viewer = null; renderDeck({ scroll: "bottom" }); }
      });

      function openDeckBuilder() {
        const topic = String(setupTopic || currentProject()?.title || "My presentation").trim() || "My presentation";
        const minutes = deckMinutes();
        overlayState = "deckgen";
        if (!deck || deck.topic !== topic) {
          deckTimers.forEach((timer) => window.clearTimeout(timer));
          deckTimers = [];
          deck = newDeck(topic, minutes);
          deckRun([
            { html: `Let's build <b>${escapeHtml(topic)}</b> together. Talk to me like you'd talk to a designer: I'll plan it, build the slides one by one while you watch, and you change anything, anytime, just by saying it.`, wait: 450 },
            { html: `First, who is it for, and what should happen when you finish? Hold the mic and talk, or try ${deckPhrase("investors, I'm raising a seed round")}.`, wait: 650 },
          ]);
          return;
        }
        if (!deck.slides.length) deck.minutes = minutes;
        deck.viewer = null;
        renderDeck({ scroll: "bottom" });
      }
      function closeDeckBuilder() {
        deckSpeech?.abort?.();
        deckSpeech = null;
        if (deck) { deck.voice = null; deck.viewer = null; }
        onboardingStep = 6;
        renderOnboarding();
      }
      function practiceGeneratedDeck() {
        const source = deck?.final || (deck?.slides.length ? { slides: deck.slides } : null);
        if (!source) return;
        const slides = source.slides;
        practiceSlides.splice(0, practiceSlides.length, ...slides.map((slide) => ({ name: escapeHtml(slide.title), helper: escapeHtml(slide.message), words: "", numbers: [] })));
        practiceFragments.splice(0, practiceFragments.length, ...slides.map((slide) => ({ name: escapeHtml(slide.title), text: escapeHtml(slide.message) })));
        setupSlidesAttached = true;
        deck.attached = true;
        deck.viewer = null;
        deck.voice = null;
        deckSpeech?.abort?.();
        const chat = currentProject();
        if (chat) { chat.idealFragmentStart = 1; chat.idealFragmentEnd = Math.min(2, slides.length); }
        finishRecordingSetup();
      }
      function openDeckgenDirect(params) {
        const title = (params.get("topic") || DECK_SAMPLE_TOPIC).trim() || DECK_SAMPLE_TOPIC;
        const minutes = Number(params.get("minutes")) || 10;
        newProjectCount += 1;
        const id = `project-${newProjectCount + 1}`;
        chats.unshift({ id, title, subtitle: "", preview: "Building a deck", time: "Now", letter: title[0].toUpperCase(), paused: false, trainingState: "idle", sessionCount: 0, checkpoint: null, processing: false, questionAnswered: false, moment: null });
        current = id;
        render();
        setupFeeling = null;
        setupTopic = title;
        setupLength = [3, 5, 10, 30, 60].includes(minutes) ? minutes * 60 : null;
        setupLengthOther = !setupLength;
        setupCustomMinutes = setupLength ? "" : String(minutes);
        setupSlidesAttached = false;
        onboardingStep = 6;
        openDeckBuilder();
      }
      /* ===== end deck generator ===== */

      function closeOverlay() { overlayState = null; overlay.innerHTML = ""; }
      current = "will";
      render();
      const startParams = new URLSearchParams(window.location.search);
      if (startParams.get("deckgen") === "1") openDeckgenDirect(startParams);
    })();
  </script>
</div>
