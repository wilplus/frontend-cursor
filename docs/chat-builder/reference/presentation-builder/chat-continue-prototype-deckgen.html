  DECKGEN COPY: this file is chat-continue-prototype.html plus the proposed
  "No deck? Generate one" deck builder (setup step 6, or open ?deckgen=1;
  optional &topic=...&minutes=...). All new code is marked "Deck generator".
  v2 (16 Nov 2026): no header/stepper/chips/approve button; the only input is
  mic + text + send, and every action is a typed/spoken intent ("looks good",
  "done", "show me the deck", "practice it"). FLIP reorder + cross-fade morphs.
  v3 (16 Nov 2026): Gamma-style agent flow, voice-first. Brief (questions
  with "you decide") -> plan you approve -> live narrated build, slide by
  slide -> 3 looks -> fine-tune -> final + viewer -> practise. Mic: tap to
  dictate with a live transcript, hold to talk (release sends, slide away

    @media (max-width: 720px) {

    /* ===== Deck generator (new): "No deck? Generate one" from setup step 6.
       Three passes by chat: Structure -> Visuals -> Style, then a final deck
       that feeds straight into the existing recording flow. Reuses the
       --wlp-* tokens, bubbles, pills and sheet language from above. ===== */
    #willab-chat-prototype:has(.wlp-deck-overlay) .wlp-rail { display: none; }

    .wlp-deckgen-or { display: flex; align-items: center; gap: 12px; margin: 16px 0; color: var(--wlp-muted-foreground); font-size: 12px; }
    .wlp-deckgen-or::before, .wlp-deckgen-or::after { height: 1px; flex: 1; background: var(--wlp-border); content: ""; }
    .wlp-deckgen-cta { display: flex; min-height: 72px; width: 100%; align-items: center; gap: 12px; border: 1px solid var(--wlp-border) !important; border-radius: 16px; background: var(--wlp-background); padding: 12px 14px; text-align: left; }
    .wlp-deckgen-cta:hover { border-color: var(--wlp-primary) !important; background: #fffaf6; }
    .wlp-deckgen-cta-mark { display: flex; height: 40px; width: 40px; flex: 0 0 40px; align-items: center; justify-content: center; border-radius: 999px; background: #ffeadf; color: var(--wlp-primary); }

    .wlp-deckgen-cta-copy strong { font-size: 15px; font-weight: 600; }
    .wlp-deckgen-cta-copy small { color: var(--wlp-muted-foreground); font-size: 12.5px; line-height: 1.35; }
    .wlp-deckgen-cta > svg { color: var(--wlp-muted-foreground); }
    .wlp-deckgen-attached-note { margin: 10px 0 0; color: var(--wlp-muted-foreground); font-size: 12.5px; text-align: center; }

    /* ===== Deck builder v3 (Gamma-style agent flow, voice-first) ===== */
    .wlp-deck-overlay { position: absolute; inset: 0; z-index: 12; display: flex; min-height: 0; flex-direction: column; background: var(--wlp-background); }

    .wlp-deck-steps { display: flex; align-items: center; gap: 6px; }
    .wlp-deck-steps > i { display: block; height: 1px; width: 10px; background: #d4d4d4; }
    #willab-chat-prototype .wlp-deck-steps button { display: inline-flex; min-height: 32px; align-items: center; gap: 3px; border-radius: 999px; padding: 0 6px; color: #a3a3a3; font-size: 12.5px; font-weight: 500; letter-spacing: -.005em; }
    #willab-chat-prototype .wlp-deck-steps button.is-done { color: var(--wlp-muted-foreground); }

    .wlp-deck-thread { position: relative; min-height: 0; flex: 1; overflow-y: auto; padding: 10px 20px 28px; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 22px, #000 calc(100% - 18px), transparent 100%); mask-image: linear-gradient(to bottom, transparent 0, #000 22px, #000 calc(100% - 18px), transparent 100%); scroll-behavior: auto; }
    .wlp-deck-thread-inner { display: flex; width: min(100%, 640px); flex-direction: column; gap: 14px; margin: 0 auto; }

    .wlp-deck-voice-tag svg { height: 14px; width: 14px; }
    #willab-chat-prototype .wlp-say { display: inline; border-radius: 7px; background: #fff1e8; padding: 1px 5px; color: #c84d06; font: inherit; font-weight: 550; line-height: inherit; text-align: left; cursor: pointer; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
    #willab-chat-prototype .wlp-say:hover { background: #ffe2d0; }
    .wlp-deck-note { align-self: center; border-radius: 999px; background: var(--wlp-muted); padding: 4px 11px; color: var(--wlp-muted-foreground); font-size: 12px; }
    .wlp-deck-typing { display: inline-flex; align-items: center; gap: 4px; padding: 6px 0; }
    .wlp-deck-typing i, .wlp-deck-dots i { display: block; height: 6px; width: 6px; border-radius: 999px; background: #a3a3a3; animation: wlp-deck-dot 1s infinite ease-in-out; }

    .wlp-deck-typing i:nth-child(3), .wlp-deck-dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes wlp-deck-dot { 0%, 80%, 100% { opacity: .35; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
    .wlp-deck-enter { animation: wlp-deck-in .42s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes wlp-deck-in { from { opacity: 0; transform: translateY(8px); } }

    /* Boards */
    .wlp-deck-board { display: flex; width: 100%; flex-direction: column; gap: 10px; }
    .wlp-deck-caption { margin: 0; color: var(--wlp-muted-foreground); font-size: 12.5px; }

    #willab-chat-prototype .wlp-deck-card.is-picked .wlp-deck-grip { background: var(--wlp-primary); color: #fff; }

    .wlp-deck-edit.m { margin-top: 3px; color: var(--wlp-muted-foreground); font-size: 13.5px; line-height: 1.42; }
    #willab-chat-prototype .wlp-deck-slot { display: flex; min-height: 40px; width: 100%; align-items: center; justify-content: center; border: 1.5px dashed var(--wlp-primary); border-radius: 12px; background: #fffaf6; color: #c84d06; font-size: 13px; font-weight: 600; }
    .wlp-deck-slot-row { list-style: none; }
    .wlp-deck-pick-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; border-radius: 12px; background: var(--wlp-foreground); padding: 8px 8px 8px 12px; color: #fff; font-size: 13px; }
    #willab-chat-prototype .wlp-deck-pick-bar button { border-radius: 999px; background: rgba(255,255,255,.16); padding: 6px 11px; color: #fff; font-size: 12px; font-weight: 600; }
    .wlp-deck-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
    .wlp-deck-item { position: relative; display: flex; min-width: 0; flex-direction: column; gap: 7px; }
    #willab-chat-prototype .wlp-deck-pick { display: block; width: 100%; border-radius: 12px; padding: 0; text-align: left; cursor: pointer; }
    .wlp-deck-pick .wlp-dslide { border-radius: 12px; box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 6px 22px rgba(20,20,30,.07); transition: box-shadow .2s, transform .2s; }

    .wlp-deck-item.is-building .wlp-dslide { animation: wlp-deck-ring 1.2s ease-out; }
    .wlp-deck-item-note { display: flex; align-items: center; gap: 6px; margin: 0; padding: 0 2px; color: var(--wlp-muted-foreground); font-size: 12.5px; }
    .wlp-deck-item-note > span { color: var(--wlp-foreground); font-weight: 700; font-variant-numeric: tabular-nums; }
    #willab-chat-prototype .wlp-deck-zoom { display: flex; height: 32px; width: 32px; align-items: center; justify-content: center; margin: -6px -6px -6px auto; border-radius: 999px; color: #a3a3a3; }
    #willab-chat-prototype .wlp-deck-zoom:hover { background: var(--wlp-muted); color: var(--wlp-foreground); }
    .wlp-deck-slide-actions { display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; animation: wlp-deck-in .3s ease-out both; }
    #willab-chat-prototype .wlp-deck-slide-actions .wlp-say { display: inline-flex; min-height: 32px; align-items: center; border-radius: 999px; padding: 0 11px; }
    .wlp-deck-skeleton { position: relative; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 12px; background: #f4f4f4; padding: 7% 8%; }
    .wlp-deck-skeleton i { display: block; height: 8%; width: 30%; margin-bottom: 4%; border-radius: 999px; background: #e9e9e9; }
    .wlp-deck-skeleton i:nth-child(2) { height: 13%; width: 70%; }
    .wlp-deck-skeleton i:nth-child(3) { width: 52%; }
    .wlp-deck-skeleton::after { position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.75) 50%, transparent 70%); animation: wlp-deck-shimmer 1.3s infinite; content: ""; }
    @keyframes wlp-deck-shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
    .wlp-deck-item.is-pending .wlp-deck-item-note { opacity: .55; }
    .wlp-deck-ghost { position: absolute; inset: 0 0 auto; pointer-events: none; }
    .wlp-deck-ghost .wlp-dslide { border-radius: 12px; }

    /* Version cards, looks, final */

    .wlp-deck-look-copy strong { font-size: 14.5px; font-weight: 650; }
    .wlp-deck-look-copy small { color: var(--wlp-muted-foreground); font-size: 12.5px; }
    .wlp-deck-final { display: flex; width: 100%; flex-direction: column; gap: 8px; }
    #willab-chat-prototype .wlp-deck-final-slide { display: block; width: 100%; padding: 0; }
    .wlp-deck-final-slide .wlp-dslide { border-radius: 14px; box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 14px 36px rgba(20,20,30,.12); }

    #willab-chat-prototype .wlp-deck-link { display: inline-flex; min-height: 44px; align-items: center; border: 1px solid var(--wlp-border); border-radius: 999px; padding: 0 16px; color: var(--wlp-foreground); font-size: 14px; font-weight: 600; }
    #willab-chat-prototype .wlp-deck-link.primary { border-color: var(--wlp-foreground); background: var(--wlp-foreground); color: #fff; }

    /* Dock: one composer, mic + text + send/stop */
    .wlp-deck-dock { position: relative; z-index: 2; flex: 0 0 auto; padding: 4px 16px max(16px, env(safe-area-inset-bottom)); }
    .wlp-deck-dock > * { width: min(100%, 640px); margin-left: auto; margin-right: auto; }
    .wlp-deck-state { display: flex; min-height: 30px; align-items: center; gap: 8px; padding: 0 6px 6px; color: var(--wlp-muted-foreground); font-size: 12.5px; }

    .wlp-deck-state-hint { margin-left: auto; color: #a3a3a3; }
    .wlp-deck-state.is-listening { color: var(--wlp-record); font-weight: 550; }
    .wlp-deck-dots { display: inline-flex; gap: 3px; }
    .wlp-deck-dots i { height: 5px; width: 5px; background: var(--wlp-primary); }
    .wlp-deck-bars { display: inline-flex; height: 14px; align-items: center; gap: 2px; }
    .wlp-deck-bars i { display: block; height: 100%; width: 3px; border-radius: 3px; background: currentColor; animation: wlp-deck-bar .9s infinite ease-in-out; }
    .wlp-deck-bars i:nth-child(2) { animation-delay: .1s; } .wlp-deck-bars i:nth-child(3) { animation-delay: .2s; } .wlp-deck-bars i:nth-child(4) { animation-delay: .3s; } .wlp-deck-bars i:nth-child(5) { animation-delay: .4s; }
    @keyframes wlp-deck-bar { 0%, 100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }
    #willab-chat-prototype .wlp-deck-undo { display: inline-flex; min-height: 30px; align-items: center; gap: 6px; border-radius: 999px; background: var(--wlp-muted); padding: 0 11px; color: var(--wlp-foreground); font-size: 12.5px; font-weight: 550; }
    .wlp-deck-composer { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px; border: 1px solid var(--wlp-border); border-radius: 28px; background: var(--wlp-background); padding: 6px; box-shadow: 0 8px 30px rgba(20,20,30,.07); transition: border-color .2s, box-shadow .2s; }
    .wlp-deck-composer:focus-within { border-color: #cfcfcf; }
    .wlp-deck-composer.is-listening { border-color: rgba(229,56,59,.45); box-shadow: 0 0 0 4px rgba(229,56,59,.08), 0 8px 30px rgba(20,20,30,.07); }
    .wlp-deck-composer.is-cancelling { opacity: .55; }
    .wlp-deck-scope { display: inline-flex; flex-basis: 100%; align-items: center; gap: 2px; margin: 2px 0 0 8px; color: #c84d06; font-size: 12.5px; font-weight: 650; }

    @keyframes wlp-deck-mic { 0% { box-shadow: 0 0 0 0 rgba(229,56,59,.45); } 100% { box-shadow: 0 0 0 14px rgba(229,56,59,0); } }
    .wlp-deck-mic svg { height: 20px; width: 20px; }
    .wlp-deck-input, .wlp-deck-live { min-width: 0; min-height: 44px; flex: 1; border: 0; background: transparent; padding: 11px 4px; color: var(--wlp-foreground); font: inherit; font-size: 16px; line-height: 22px; outline: 0; resize: none; }

    #willab-chat-prototype .wlp-deck-send.is-stop { background: var(--wlp-foreground); }

    /* Viewer */
    .wlp-deck-viewer { background: #0d0d0f; color: #fff; }

    #willab-chat-prototype .wlp-deck-viewer .wlp-deck-back { color: #fff; }

  <script>
    (() => {
      const root = document.getElementById("willab-chat-prototype");
      if (!root) return;
      const list = document.getElementById("wlp-chat-list");
      const view = document.getElementById("wlp-chat-view");
      const overlay = document.getElementById("wlp-overlay");
      if (!list || !view || !overlay) return;

      const icons = {
        back: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>',
        pin: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 17 5 5v-6.5a7 7 0 1 0-10 0V22l5-5Z"/></svg>',
        layers: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 2 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/></svg>',
        mic: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8" y="2" width="8" height="13" rx="4"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8"/></svg>',
        send: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>',
        play: '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="m8 5 11 7-11 7V5Z"/></svg>',
        feedback: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 5.5h14v10H9l-4 3v-13Z"/><path d="M8 9h8M8 12h5"/></svg>',
        present: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 5h18v11H3zM8 21h8M12 16v5"/><path d="m17 10 3 3-3 3"/></svg>',
        pause: '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h3v14H7zM14 5h3v14h-3z"/></svg>',
        check: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 4 4L19 6"/></svg>',
        arrow: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>',
        plus: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
        upload: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M5 20h14"/></svg>',
        timer: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.5M9 2h6M12 2v3"/></svg>',
        x: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg>'
      };

      const chats = [
        { id: "project-1", title: "testingg", subtitle: "", preview: "Pick up at slide 1 &middot; 5 minutes left", time: "Now", letter: "T", paused: true, trainingState: "paused", sessionCount: 1, checkpoint: "slide 1 &middot; opening", duration: "5 minutes", timeLimitMinutes: 40, processing: false, questionAnswered: false, moment: "practice", idealFragmentStart: 1, idealFragmentEnd: 2 },
        { id: "project-2", title: "Board meeting", subtitle: "", preview: "Five practice chunks ready", time: "Today", letter: "B", paused: true, trainingState: "paused", sessionCount: 5, checkpoint: "slide 1 · opening", duration: "5 minutes", timeLimitMinutes: 40, processing: false, questionAnswered: false, moment: "practice", idealFragmentStart: 1, idealFragmentEnd: 2 },
      ];
      let current = new URLSearchParams(window.location.search).get("project") || "will";
      let overlayState = null;
      let newProjectCount = 0;
      let idealMenuOpen = false;
      let idealCopied = false;
      let onboardingStep = 0;
      let onboardingConsent = false;
      let onboardingCountry = "";
      let setupFeeling = null;
      let setupTopic = "";
      let setupLength = 300;
      let setupLengthOther = false;
      let setupCustomMinutes = "";
      let setupSlidesAttached = false;
      let practiceMode = "continue";
      let practiceSlide = 1;
      let practiceElapsedSeconds = 0;
      let practiceDurationSeconds = 240;
      let practiceReturnState = "practice-picker";
      let practicePartial = true;
      let practiceSaved = false;
      let projectResearch = { projectId: null, targetSlide: 3, step: 0, answers: [], decisionPending: false };
      let feedbackWalkExpanded = false;
      let feedbackWalkTitle = "";
      const feedbackHistory = [
        { attempts: 2, slideRange: "1-5", date: "2 Nov", score: 48, quality: "Not yet there", tone: "needs-work" },
        { attempts: 4, slideRange: "6-12", date: "5 Nov", score: 57, quality: "Almost", tone: "almost" },
        { attempts: 6, slideRange: "13-18", date: "8 Nov", score: 63, quality: "Good", tone: "good" },
        { attempts: 8, slideRange: "19-24", date: "10 Nov", score: 69, quality: "Good", tone: "good" },
        { attempts: 10, slideRange: "25-30", date: "12 Nov", score: 74, quality: "Strong delivery", tone: "strong" },
      ];
      const feedbackSingle = [{ attempts: 10, slideRange: "1-5", date: "12 Nov", score: 10, quality: "Not yet there", tone: "needs-work" }];
      let feedbackWagons = feedbackHistory;
      function feedbackWagonsForChat(chat = currentProject()) {
        const state = new URLSearchParams(window.location.search).get("state");
        if (state === "single" || String(chat?.title || "").toLowerCase() === "testingg") return feedbackSingle.map((chunk) => ({ ...chunk }));
        return feedbackHistory;
      }
      let presentationSlideIndex = 0;
      let presentationTheme = "blue";
      const presentationThemes = {
        blue: { label: "Blue", surface: "#e9ebf4", slide: "#2148be", ink: "#fff", accent: "#ffb083" },
        warm: { label: "Warm", surface: "#f4ece6", slide: "#e4c7ad", ink: "#271f1a", accent: "#c2613e" },
        light: { label: "Light", surface: "#f1f1ef", slide: "#fff", ink: "#201e1c", accent: "#ff6727" },
      };
      const presentationExamples = [
        { label: "Opening", title: "Make the idea easy to follow.", copy: "One thought at a time, with room for the listener to stay with you." },
        { label: "The point", title: "Start with the change you want.", copy: "Give the audience a reason to care before you add the detail." },
        { label: "The proof", title: "Show one useful example.", copy: "A small, concrete moment makes the bigger idea believable." },
        { label: "The ask", title: "Make the next step clear.", copy: "End with one action that feels simple to take." },
        { label: "Close", title: "Leave them with the line.", copy: "Repeat the idea they should remember after the room goes quiet." },
      ];
      let sundayNote = {
        status: "offered",
        step: "bug",
        rows: [],
        principle: "State your point without weakening it first.",
        editingError: false,
        editingPrinciple: false,
      };

      const mark = (chat) => chat.id === "will"
        ? '<span class="wlp-will-mark" aria-hidden><i></i><i></i><i></i></span>'
        : `<span class="wlp-project-mark" aria-hidden>${chat.letter}</span>`;

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[character]);
      }

      function chatRow(chat) {
        const selected = current === chat.id ? " is-selected" : "";
        const subtitle = chat.id === "will" ? "Speaking Coach" : chat.subtitle;
        const preview = chat.preview || (chat.id === "will" ? "AI audio is ready" : "");
        return `<div class="wlp-chat-row${selected}${chat.paused ? " is-paused" : ""}" role="button" tabindex="0" data-open-chat="${chat.id}">
          ${mark(chat)}
          <span class="wlp-chat-main">
            <span class="wlp-chat-line"><strong class="wlp-chat-title">${chat.title}</strong><span class="wlp-chat-subtitle">${subtitle}</span><span class="wlp-chat-time">${chat.time || ""}</span></span>
            <span class="wlp-chat-preview">${preview}</span>
          </span>
          <span class="wlp-row-actions">${chat.id === "will" ? `<span class="wlp-pin" title="Pinned">${icons.pin}</span>` : `<button class="wlp-row-menu" type="button" data-chat-menu="${chat.id}" aria-label="Project actions">&middot;&middot;&middot;</button>`}</span>
        </div>`;
      }

      function renderList() {
        list.innerHTML = chatRow({ id: "will", title: "Will", time: "", preview: "AI audio is ready" }) + chats.filter((chat) => !chat.archived).map(chatRow).join("");
        list.querySelectorAll("[data-open-chat]").forEach((row) => {
          const open = () => {
            current = row.getAttribute("data-open-chat") || "will";
            render();
          };
          row.addEventListener("click", (event) => { if (!event.target.closest("[data-chat-menu]")) open(); });
          row.addEventListener("keydown", (event) => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); open(); } });
        });
        list.querySelectorAll("[data-chat-menu]").forEach((button) => button.addEventListener("click", (event) => { event.stopPropagation(); openProjectActions(button.getAttribute("data-chat-menu")); }));
      }

      function topbar(title, subtitle) {
        const isWill = title === "Will" || title === "Speaking coach";
        const topMark = isWill ? '<span class="wlp-will-mark wlp-top-mark" aria-hidden><i></i><i></i><i></i></span>' : mark({ id: "project", title, letter: title[0] });
        return `<header class="wlp-topbar"><button class="wlp-back" type="button" data-back aria-label="Back">${icons.back}</button>${topMark}<span class="wlp-top-title"><strong>${title}</strong>${subtitle ? `<span>${subtitle}</span>` : ""}</span></header>`;
      }

      function feedbackWalkCard(openAttribute = "data-open-walk") {
        feedbackWagons = feedbackWagonsForChat();
        const hidden = feedbackWagons.length - 1;
        const inferredTitle = currentProject()?.title || "Presentation";
        const displayTitle = feedbackWalkTitle || inferredTitle;
        const overallProgress = feedbackWagons[feedbackWagons.length - 1]?.score || 0;
        const isSingleChunk = feedbackWagons.length === 1;
        const visible = feedbackWalkExpanded ? feedbackWagons : feedbackWagons.slice(-1);
        const wagons = visible.map((wagon, index) => {
          const latest = index === visible.length - 1;
          const label = `Slides ${wagon.slideRange}`;
          const meta = latest ? `${wagon.date} - next: strengthen` : `${wagon.date} - practice`;
          return `<div class="wlp-feedback-wagon ${latest ? "wlp-feedback-wagon-latest" : "wlp-feedback-wagon-old"}" data-feedback-wagon-index="${feedbackWagons.indexOf(wagon)}">
            <button class="wlp-feedback-wagon-thumb" type="button" data-open-presentation aria-label="Open slide image"><span class="wlp-feedback-wagon-thumb-image" aria-hidden="true"></span></button>
            <div class="wlp-feedback-wagon-copy"><div class="wlp-feedback-wagon-row"><span class="wlp-feedback-range-wrap"><span class="wlp-feedback-wagon-name" data-feedback-range contenteditable="true" spellcheck="false" title="Click to edit slides" aria-label="Edit slide range">${escapeHtml(label)}</span><span class="wlp-feedback-edit-hint" aria-hidden="true">Edit</span></span><span class="wlp-feedback-wagon-stats"><span class="wlp-feedback-wagon-take">${wagon.attempts} ${wagon.attempts === 1 ? "attempt" : "attempts"}</span></span></div><div class="wlp-feedback-wagon-quality-row"><span class="wlp-feedback-quality ${wagon.tone}"><span class="wlp-feedback-quality-icon" aria-hidden="true"></span>${wagon.quality}</span></div></div>
          </div>`;
        }).join("");
        return `<div class="wlp-feedback-walk-card${isSingleChunk ? " is-single-chunk" : ""}">
          <div class="wlp-feedback-walk-card-head"><div class="wlp-feedback-title-line"><div class="wlp-feedback-walk-title" data-feedback-walk-title contenteditable="true" spellcheck="false" title="Click to rename presentation" aria-label="Edit presentation name">${escapeHtml(displayTitle)}</div><span class="wlp-feedback-edit-hint" aria-hidden="true">Click to edit</span></div></div>
          <div class="wlp-feedback-general"><div class="wlp-feedback-general-row"><span>Progress</span><b>${overallProgress}%</b></div><div class="wlp-feedback-general-track" aria-label="${overallProgress}% progress"><span style="width:${overallProgress}%"></span></div></div>
          ${hidden > 0 ? `<button class="wlp-feedback-walk-toggle" type="button" data-feedback-walk-toggle aria-expanded="${feedbackWalkExpanded}">${feedbackWalkExpanded ? "Hide earlier chunks" : `Show ${hidden} earlier chunks`}</button>` : ""}
          <div class="wlp-feedback-chain">${wagons}</div>
          <div class="wlp-feedback-walk-actions"><button class="primary" type="button" ${openAttribute}>${icons.feedback}Feedback</button><button class="secondary" type="button" data-open-presentation>${icons.present}Ideal text</button></div>
        </div>`;
      }

      function composer() {
        // Lounge.tsx: Layers | textarea | conditional Send. There is no
        // microphone in the real off-task Lounge composer.
        return `<form class="wlp-composer" id="wlp-composer"><button class="wlp-icon-button" id="wlp-projects" type="button" aria-label="Your projects">${icons.layers}</button><span class="wlp-input-wrap"><textarea class="wlp-input" rows="1" placeholder="Message Will" aria-label="Message Will"></textarea><button class="wlp-send is-hidden" id="wlp-send" type="submit" aria-label="Send">${icons.send}</button></span></form>`;
      }

      function willChat() {
        const planHello = `<div class="wlp-bubble-row wlp-plan-row"><div class="wlp-plan-bubble">Hi Artur, good to see you back!<strong>Make it yours</strong><div class="wlp-plan-bar" aria-label="Three practices completed"><i class="done"></i><i class="done"></i><i class="done"></i><i></i></div><button type="button" class="wlp-plan-link" data-open-plan>See your plan</button></div></div>`;
        const sundayRows = sundayNote.rows.map((row) => `<div class="wlp-bubble-row${row.role === "user" ? " me" : ""}"><div class="wlp-bubble${row.role === "user" ? " me" : ""}">${escapeHtml(row.body)}</div></div>`).join("");
        const waiting = sundayNote.status === "offered" || sundayNote.status === "investigating";
        const dock = sundayNote.status === "offered"
          ? `<div class="wlp-sunday-offer-dock"><button type="button" class="outline" data-sunday-dismiss>Not now</button><button type="button" class="dark" data-sunday-investigate>Investigate</button></div>`
          : composer();
        return `${topbar("Speaking coach", "")}
          <div class="wlp-thread wlp-lounge-thread">
            <div class="wlp-date-line">Friday 13 November</div>
            ${planHello}
            <div class="wlp-bubble-row wlp-screenshot-message wlp-long wlp-one-thing"><div class="wlp-bubble">Today, one thing: say it like your best moment. You've got this &#x1F4AA;</div></div>
            <div class="wlp-date-line">Saturday 14 November</div>
            ${planHello}
            <div class="wlp-bubble-row wlp-screenshot-message wlp-long wlp-one-thing"><div class="wlp-bubble">Today, one thing: say it like your best moment. You've got this &#x1F4AA;</div></div>
            <div class="wlp-date-line">Sunday 15 November</div>
            <div class="wlp-bubble-row"><button type="button" class="wlp-sunday-head${waiting ? " is-waiting" : ""}" data-sunday-open>We spotted a pattern!<span aria-hidden="true">&rsaquo;</span></button></div>
            <div class="wlp-bubble-row wlp-screenshot-message wlp-long"><div class="wlp-bubble">Across your recent projects, you often begin important points with &ldquo;I don&rsquo;t know, but I think&hellip;&rdquo;, which weakens your case before you make it.</div></div>
            ${sundayRows}
          </div>${dock}`;
      }

      function sundaySay(role, body) {
        sundayNote.rows.push({ role, body });
      }

      function openSundayLens() {
        if (sundayNote.status === "offered") sundayNote.status = "investigating";
        if (sundayNote.step === "bug" && !sundayNote.rows.some((row) => row.body === "What kind of error is it?")) sundaySay("bot", "What kind of error is it?");
        renderSundayLens();
      }

      function finishSundayPrinciple(choice, editedText = "") {
        if (choice === "not_now") {
          sundaySay("user", "Not now");
          sundaySay("bot", "Noted.");
          sundayNote.status = "declined";
        } else {
          if (choice === "edit" && editedText.trim()) sundayNote.principle = editedText.trim();
          sundaySay("user", choice === "accept" ? "Accept" : `\u269C\uFE0F ${sundayNote.principle}`);
          sundaySay("bot", "Noted. Added to your principles.");
          sundayNote.status = "done";
        }
        sundayNote.step = "done";
        sundayNote.editingPrinciple = false;
        renderSundayLens();
      }

      function renderSundayLens() {
        overlayState = "sunday-note";
        const rows = sundayNote.rows.map((row) => `<div class="wlp-walk-row${row.role === "user" ? " me" : ""}"><div class="wlp-walk-bubble${row.body.startsWith("\u269C") ? " wlp-sunday-principle" : ""}">${escapeHtml(row.body)}</div></div>`).join("");
        let dock = "";
        if (sundayNote.step === "bug" && sundayNote.editingError) {

        } else if (sundayNote.step === "principle" && sundayNote.editingPrinciple) {

        overlay.innerHTML = `<div class="wlp-full-overlay wlp-sunday-lens" role="dialog" aria-modal="true" aria-label="Sunday note"><div class="wlp-walk-top"><div class="wlp-walk-nav"><button type="button" data-sunday-close aria-label="Back">${icons.back}</button><span>Sunday note</span><span aria-hidden="true">&rsaquo;</span></div><button type="button" class="wlp-overlay-close" data-sunday-close aria-label="Close">${icons.x}</button></div><div class="wlp-walk-body"><div class="wlp-walk-thread"><div class="wlp-walk-row"><div class="wlp-walk-bubble">We spotted a pattern!</div></div><div class="wlp-walk-row"><div class="wlp-walk-bubble">Across your recent projects, you often begin important points with &ldquo;I don&rsquo;t know, but I think&hellip;&rdquo;, which weakens your case before you make it.</div></div>${rows}</div></div><div class="wlp-sunday-lens-dock">${dock}</div></div>`;
        overlay.querySelectorAll("[data-sunday-close]").forEach((button) => button.addEventListener("click", () => { closeOverlay(); current = "will"; render(); }));
        overlay.querySelectorAll("[data-sunday-error]").forEach((button) => button.addEventListener("click", () => {
          sundaySay("user", button.getAttribute("data-sunday-error"));
          sundaySay("bot", "Did you have a principle in place already?");
          sundayNote.step = "applied";
          renderSundayLens();
        }));
        overlay.querySelector("[data-sunday-new-error]")?.addEventListener("click", () => { sundayNote.editingError = true; renderSundayLens(); });
        overlay.querySelector("[data-sunday-back-error]")?.addEventListener("click", () => { sundayNote.editingError = false; renderSundayLens(); });
        const errorName = overlay.querySelector("#wlp-sunday-error-name");

        overlay.querySelector("[data-sunday-skip]")?.addEventListener("click", () => keepReflection(""));
        overlay.querySelector("[data-sunday-accept]")?.addEventListener("click", () => finishSundayPrinciple("accept"));
        overlay.querySelector("[data-sunday-edit]")?.addEventListener("click", () => { sundayNote.editingPrinciple = true; renderSundayLens(); });
        overlay.querySelector("[data-sunday-back-principle]")?.addEventListener("click", () => { sundayNote.editingPrinciple = false; renderSundayLens(); });
        overlay.querySelector("[data-sunday-add-principle]")?.addEventListener("click", () => {
          const field = overlay.querySelector("#wlp-sunday-principle");

      function projectChat(chat) {
        const active = chat.trainingState === "active";
        const hasPractice = Boolean(chat.moment || chat.sessionCount);
        const isResearching = projectResearch.projectId === chat.id;
        const answers = isResearching ? projectResearch.answers : [];
        const safeAnswers = answers.map(escapeHtml);
        const researchRows = isResearching ? `<div class="wlp-project-context">
          <div class="wlp-bubble-row"><div class="wlp-bubble">Ok, now let's understand the context behind that moment.</div></div>
          <div class="wlp-bubble-row"><div class="wlp-bubble">We just worked on &ldquo;Even if it's so light, it's barely visible, it's just shining like, like a diamond. Like a diamond&rdquo;. Who were you talking to? &#x1F3AF;</div></div>
          ${answers[0] ? `<div class="wlp-bubble-row me"><div class="wlp-bubble me">${safeAnswers[0]}</div></div><div class="wlp-bubble-row"><div class="wlp-bubble">What did you want the person listening to feel or do after hearing this part? &#x1F914;</div></div>` : ""}
          ${answers[1] ? `<div class="wlp-bubble-row me"><div class="wlp-bubble me">${safeAnswers[1]}</div></div><div class="wlp-bubble-row"><div class="wlp-bubble">We read this moment as gentle and reassuring, rather than persuasive. Does that match what you wanted?</div></div>` : ""}
          ${answers[2] ? `<div class="wlp-bubble-row me"><div class="wlp-bubble me">${safeAnswers[2]}</div></div><div class="wlp-bubble-row"><div class="wlp-bubble">Got it. I&rsquo;ll keep that as context for ${escapeHtml(chat.title)}.</div></div><div class="wlp-bubble-row"><div class="wlp-bubble">Ready to choose what you want to practise next?</div></div>` : ""}
          ${projectResearch.step < 3 ? `<div class="wlp-project-answer-options">${(projectResearch.step === 0 ? ["Myself", "A client", "My team"] : projectResearch.step === 1 ? ["Reassure them", "Help them decide", "Make it memorable"] : ["Yes, reassuring", "Not quite"]).map((answer) => `<button type="button" data-project-answer="${answer}">${answer}</button>`).join("")}</div>` : ""}
        </div>` : "";
        const history = hasPractice ? `
            <div class="wlp-project-pair">
              ${feedbackWalkCard("data-open-walk")}
              <span data-open-ideal-text hidden aria-hidden="true"></span>
            </div>
            ${researchRows}
          ` : "";
        const actionLabel = active ? "Stop and see feedback" : hasPractice ? "Continue recording" : "Start recording";
        const needsAnswer = isResearching && projectResearch.step < 3;
        const dock = needsAnswer
          ? `<form class="wlp-project-answer-composer wlp-composer" id="wlp-project-answer-form"><button class="wlp-icon-button" id="wlp-projects" type="button" aria-label="Your projects">${icons.layers}</button><span class="wlp-input-wrap"><textarea class="wlp-input" id="wlp-project-answer-input" rows="1" placeholder="Or type your answer" aria-label="Answer about this take"></textarea><button class="wlp-send is-hidden" id="wlp-project-answer-send" type="submit" aria-label="Send answer">${icons.send}</button></span></form>`
          : `<div class="wlp-project-composer wlp-composer"><button class="wlp-icon-button" id="wlp-projects" type="button" aria-label="Your projects">${icons.layers}</button><button class="wlp-record-dock-button" id="${active ? "wlp-pause" : "wlp-continue"}" type="button"><span class="wlp-record-dot"></span>${actionLabel}</button></div>`;
        return `${topbar(chat.title, "")}
          <div class="wlp-thread wlp-lounge-thread wlp-project-thread">
            ${history}
          </div>${dock}`;
      }

      function listView() {
        return "";
      }

      function answerProjectResearch(chat, answer) {
        const value = String(answer || "").trim();
        if (!chat || projectResearch.projectId !== chat.id || projectResearch.step >= 3 || !value) return;
        projectResearch.answers[projectResearch.step] = value;
        projectResearch.step += 1;
        chat.preview = projectResearch.step === 3 ? `Ready to continue from slide ${projectResearch.targetSlide}` : value;
        chat.time = "Now";
        render();
      }

      function render() {
        root.dataset.view = current;
        renderList();
        const chat = chats.find((item) => item.id === current);
        view.innerHTML = current === "list" ? listView() : current === "will" ? willChat() : projectChat(chat || chats[0]);
        if (current === "will" || projectResearch.projectId === current) requestAnimationFrame(() => { const thread = view.querySelector(".wlp-thread"); if (thread) thread.scrollTop = thread.scrollHeight; });
        view.querySelector("[data-back]")?.addEventListener("click", () => { current = "list"; render(); });
        view.querySelector("#wlp-projects")?.addEventListener("click", () => openProjectSheet());
        view.querySelectorAll("[data-open-plan]").forEach((button) => button.addEventListener("click", () => openPlanSheet()));
        view.querySelector("[data-sunday-open]")?.addEventListener("click", openSundayLens);
        view.querySelector("[data-sunday-investigate]")?.addEventListener("click", openSundayLens);
        view.querySelector("[data-sunday-dismiss]")?.addEventListener("click", () => {
          sundayNote.status = "declined";
          sundayNote.step = "done";
          sundaySay("user", "Not now");
          sundaySay("bot", "Noted.");
          render();
        });
        view.querySelectorAll("[data-ref-project]").forEach((button) => button.addEventListener("click", () => { current = button.getAttribute("data-ref-project") || "project-1"; render(); }));
        view.querySelectorAll("[data-open-walk]").forEach((button) => button.addEventListener("click", () => openPracticeFeedbackWalk(false)));
        view.querySelectorAll("[data-open-ideal-text]").forEach((button) => button.addEventListener("click", openIdealText));
        view.querySelectorAll("[data-open-presentation]").forEach((button) => button.addEventListener("click", openIdealText));
        view.querySelector("[data-feedback-walk-toggle]")?.addEventListener("click", () => {
          feedbackWalkExpanded = !feedbackWalkExpanded;
          render();
        });
        const feedbackTitle = view.querySelector("[data-feedback-walk-title]");
        feedbackTitle?.addEventListener("input", (event) => {
          feedbackWalkTitle = event.currentTarget.textContent?.trim() || currentProject()?.title || "Presentation";
        });
        feedbackTitle?.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            event.preventDefault();
            feedbackTitle.blur();
          }
          if (event.key === "Escape") {
            event.preventDefault();
            feedbackWalkTitle = "";
            render();
          }
        });
        view.querySelectorAll("[data-feedback-range]").forEach((field) => {
          const row = field.closest("[data-feedback-wagon]");
          const index = Number(row?.getAttribute("data-feedback-wagon-index"));
          const cleanRange = (value) => String(value || "").replace(/^slides\s*/i, "").trim() || "1-5";
          field.addEventListener("input", (event) => {
            if (feedbackWagons[index]) feedbackWagons[index].slideRange = cleanRange(event.currentTarget.textContent);
          });
          field.addEventListener("blur", () => {
            if (!feedbackWagons[index]) return;
            feedbackWagons[index].slideRange = cleanRange(field.textContent);
            field.textContent = `Slides ${feedbackWagons[index].slideRange}`;
          });
          field.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
              event.preventDefault();
              field.blur();
            }
            if (event.key === "Escape") {
              event.preventDefault();
              field.textContent = `Slides ${feedbackWagons[index]?.slideRange || "1-5"}`;
              field.blur();
            }
          });
        });
        view.querySelectorAll("[data-processing-answer]").forEach((button) => button.addEventListener("click", () => { if (chat) { chat.questionAnswered = true; chat.preview = "Processing question answered"; chat.time = "Now"; } render(); }));
        view.querySelectorAll("[data-project-answer]").forEach((button) => button.addEventListener("click", () => answerProjectResearch(chat, button.getAttribute("data-project-answer"))));
        view.querySelector("#wlp-pause")?.addEventListener("click", () => { if (chat) { practiceMode = "continue"; practiceSlide = Number((chat.checkpoint || "").match(/slide (\d+)/i)?.[1] || 1); openPracticeRecording(chat); } });
        view.querySelector("#wlp-continue")?.addEventListener("click", () => {
          if (!chat) return;
          if (projectResearch.projectId === chat.id && projectResearch.step >= 3 && projectResearch.decisionPending) openIdealText();
          else if (chat.sessionCount) openPracticePicker(chat, false);
          else openProjectSetup(chat);
        });
        const composerForm = view.querySelector("#wlp-composer");
        const input = composerForm?.querySelector(".wlp-input");
        const send = composerForm?.querySelector("#wlp-send");
        const resize = () => {
          if (!input) return;
          input.style.height = "auto";
          input.style.height = `${Math.min(input.scrollHeight, 160)}px`;
          send?.classList.toggle("is-hidden", !input.value.trim());
        };
        input?.addEventListener("input", resize);
        input?.addEventListener("keydown", (event) => {
          if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            composerForm?.requestSubmit();
          }
        });
        composerForm?.addEventListener("submit", (event) => {
          event.preventDefault();
          const text = input?.value.trim();
          if (!text) return;
          if (chat) { chat.lastMessage = text; chat.preview = text; chat.time = "Now"; }
          render();
        });
        const projectAnswerForm = view.querySelector("#wlp-project-answer-form");
        const projectAnswerInput = projectAnswerForm?.querySelector("#wlp-project-answer-input");
        const projectAnswerSend = projectAnswerForm?.querySelector("#wlp-project-answer-send");
        const resizeProjectAnswer = () => {
          if (!projectAnswerInput) return;
          projectAnswerInput.style.height = "auto";
          projectAnswerInput.style.height = `${Math.min(projectAnswerInput.scrollHeight, 120)}px`;
          projectAnswerSend?.classList.toggle("is-hidden", !projectAnswerInput.value.trim());
        };
        projectAnswerInput?.addEventListener("input", resizeProjectAnswer);
        projectAnswerInput?.addEventListener("keydown", (event) => {
          if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); projectAnswerForm?.requestSubmit(); }
        });
        projectAnswerForm?.addEventListener("submit", (event) => {
          event.preventDefault();
          answerProjectResearch(chat, projectAnswerInput?.value);
        });
      }

      function openPlanSheet() {
        overlayState = "plan";
        overlay.innerHTML = `<div class="wlp-sheet-backdrop" data-close-overlay><div class="wlp-sheet" role="dialog" aria-label="Your plan" data-stop-close><div class="wlp-grabber"></div><h2>Your plan</h2><p>This week's level</p><strong style="display:block;margin-bottom:12px">Make it yours</strong><div class="wlp-plan-bar"><i class="done"></i><i class="done"></i><i class="done"></i><i></i></div><ul style="margin:18px 0 0;padding-left:20px;font-size:14px;line-height:1.6"><li>15 minutes, 3 times a week</li><li>Your deadline: 30 November</li></ul><div class="wlp-sheet-footer"><button class="wlp-button outline" type="button" data-close-button>Close</button></div></div></div>`;
        overlay.querySelector("[data-stop-close]")?.addEventListener("click", (event) => event.stopPropagation());

      const practiceSlides = [
        { name: "Opening", helper: "What you&apos;ll talk about, in one line.", words: "Even if it&apos;s so light...", numbers: [] },
        { name: "Main points", helper: "", words: "like a diamond. Like", numbers: [1, 2, 3] },
        { name: "Close", helper: "", words: "", numbers: [] },
      ];

      const practiceFragments = [
        { name: "Opening", text: "Well, I will talk about the weather today, which is surprisingly awful, but feels nice, feels cosy, even though it&apos;s mostly outside." },
        { name: "Main points", text: "It&apos;s this kind of Scottish, mysterious weather, when you don&apos;t know what to do, try to go out, try to stay and enjoy the cosy bed." },
        { name: "Close", text: "The point is simple: choose what your obligations require, and make that decision clear." },
      ];

      function currentPracticeFragmentText() {
        return practiceFragments[Math.max(0, Math.min(practiceFragments.length - 1, practiceSlide - 1))].text;
      }

      function practiceIsLongPresentation() {
        return practiceDurationSeconds >= 300;
      }

      function currentProject() {
        return chats.find((item) => item.id === current) || chats.find((item) => item.id === "project-1") || chats[0];
      }

      function practiceSlideData() {
        return practiceSlides[Math.max(0, Math.min(practiceSlides.length - 1, practiceSlide - 1))];
      }

      function practiceTime(seconds) {
        const minutes = Math.floor(seconds / 60);
        const remainder = String(seconds % 60).padStart(2, "0");
        return `${minutes}:${remainder}`;
      }

      function practiceClock(seconds, targetSeconds) {
        if (!targetSeconds) return { label: practiceTime(seconds), overrun: false };
        const overrun = seconds > targetSeconds;
        const magnitude = overrun ? seconds - targetSeconds : Math.max(0, targetSeconds - seconds);
        return { label: `${overrun ? "-" : ""}${practiceTime(magnitude)}`, overrun };
      }

      function practiceDurationLabel(seconds) {
        if (!seconds) return "No limit";
        return `${Math.round(seconds / 60)} min`;
      }

      function practiceDurationDetail(seconds) {
        if (!seconds) return "Stop whenever you choose";
        return `${practiceTime(seconds)} of active practice`;
      }

      function feedbackWave(seed = 0) {
        const heights = [8, 14, 20, 11, 24, 16, 27, 13, 22, 9, 25, 17, 28, 12, 19, 26, 10, 23, 15, 29, 18, 11, 25, 14, 21, 9, 24, 16, 27, 12, 20, 8];
        return heights.map((height, index) => `<i style="height:${heights[(index + seed) % heights.length]}px"></i>`).join("");
      }

      function projectPracticeDuration(chat) {
        const duration = String(chat?.duration || "");
        if (/until\s+i\s+stop/i.test(duration)) return 0;
        const minutes = duration.match(/(\d+)\s*minutes?/i);
        return minutes ? Number(minutes[1]) * 60 : 300;
      }

      function returnToPracticeSurface() {
        const chat = currentProject();
        if (practiceReturnState === "practice-recording") renderPracticeRecording(chat);
        else renderPracticePicker(chat);
      }

        overlay.querySelector("[data-stop-close]")?.addEventListener("click", (event) => event.stopPropagation());

      function renderPracticePicker(chat) {
        const firstTime = practiceMode === "first";
        const slide = practiceSlideData();

        </div>`;
        overlay.querySelectorAll("[data-practice-close]").forEach((button) => button.addEventListener("click", () => { closeOverlay(); render(); }));
        overlay.querySelector("[data-practice-start]")?.addEventListener("click", () => openPracticeRecording(chat));
      }

      function openPracticeRecording(chat) {
        practiceElapsedSeconds = practiceMode === "continue" ? (practiceSlide === 1 ? 112 : practiceSlide === 2 ? 22 : 0) : 0;
        overlayState = "practice-recording";
        renderPracticeRecording(chat);
      }

      function renderPracticeRecording(chat) {
        const slide = practiceSlideData();
        const firstTime = practiceMode === "first";
        const clock = practiceClock(practiceElapsedSeconds, practiceDurationSeconds);
        const progress = practiceDurationSeconds ? Math.min(100, Math.max(3, Math.round((practiceElapsedSeconds / practiceDurationSeconds) * 100))) : 3;

        overlay.innerHTML = `<div class="wlp-practice-overlay wlp-practice-recording-overlay" role="dialog" aria-modal="true" aria-label="Practice recording">

              <div class="wlp-practice-recording-strip${clock.overrun ? " is-overrun" : ""}" aria-label="Practice recording progress"><span class="wlp-record-dot"></span><span class="wlp-practice-recording-clock">${clock.label}</span><div class="wlp-practice-recording-track" aria-hidden="true"><span style="width:${clock.overrun ? 100 : progress}%"></span></div></div>
              <div class="wlp-practice-recording-nav"><button type="button" class="wlp-practice-back" data-practice-back ${practiceSlide === 1 ? "disabled" : ""}>Back</button>${practiceSlide < practiceSlides.length ? `<button type="button" class="wlp-practice-next" data-practice-next>Next slide</button>` : `<button type="button" class="wlp-practice-next wlp-practice-finish-button" data-practice-finish aria-label="Finish take"><span class="wlp-practice-finish-square"></span>Finish take</button>`}</div>
            </div>

        overlay.querySelector("[data-practice-leave]")?.addEventListener("click", () => openPracticeFeedbackWalk(true));

        overlay.querySelectorAll("[data-practice-finish]").forEach((button) => button.addEventListener("click", () => openPracticeFeedbackWalk(false)));
        overlay.querySelector("[data-practice-next]")?.addEventListener("click", () => { practiceSlide = Math.min(practiceSlides.length, practiceSlide + 1); practiceElapsedSeconds = practiceSlide === 2 ? 22 : practiceSlide === 3 ? practiceDurationSeconds + 19 : practiceElapsedSeconds + 52; renderPracticeRecording(chat); });
      }

      function savePracticeCheckpoint(partial) {
        const chat = currentProject();
        if (!chat) return;
        const slide = practiceSlideData();
        const durationLabel = practiceDurationSeconds ? `${Math.round(practiceDurationSeconds / 60)} minutes` : "Until I stop";
        if (!practiceSaved) chat.sessionCount = (chat.sessionCount || 0) + 1;
        practiceSaved = true;
        chat.trainingState = "paused";
        chat.paused = true;
        chat.duration = durationLabel;
        chat.checkpoint = `slide ${practiceSlide} &middot; ${slide.name.toLowerCase()}`;
        chat.preview = partial ? `Pick up at slide ${practiceSlide} &middot; ${durationLabel} chunk` : `Presentation complete &middot; continue from slide ${practiceSlide}`;
        chat.time = "Now";
        chat.moment = "practice";
        chat.feedbackStatus = partial ? "partial" : "complete";
      }

      function openPracticeFeedbackWalk(partial) {
        practicePartial = partial;
        savePracticeCheckpoint(partial);
        renderPracticeFeedbackWalk();
      }

      function openProjectConversationAfterWalk() {
        const chat = currentProject();
        if (!chat) { closeOverlay(); render(); return; }
        const fragmentEnd = Math.min(practiceSlides.length, Math.max(1, Number(chat.idealFragmentEnd || practiceSlide)));
        projectResearch = { projectId: chat.id, targetSlide: Math.min(practiceSlides.length, fragmentEnd + 1), step: 0, answers: [], decisionPending: true };
        closeOverlay();
        current = chat.id;
        render();
      }

      function renderPracticeFeedbackWalk() {
        overlayState = "practice-feedback";
        overlay.innerHTML = `<div class="wlp-full-overlay wlp-walk-motion-open" role="dialog" aria-modal="true" aria-label="Feedback walk">
          <div class="wlp-walk-top"><nav class="wlp-walk-nav" aria-label="Main points"><button type="button" aria-label="Previous moment" disabled>${icons.back}</button><span>Main points</span><button type="button" aria-label="Next moment" disabled>${icons.arrow}</button></nav><button type="button" class="wlp-overlay-close" data-practice-walk-close aria-label="Close">${icons.x}</button></div>
          <div class="wlp-walk-body"><div class="wlp-walk-thread wlp-walk-motion-next">
            <span class="wlp-walk-mark">Slide 2</span>
            <div class="wlp-walk-row"><div class="wlp-walk-bubble">And here's one moment to try another way:</div></div>
            <div class="wlp-walk-audio"><div class="wlp-walk-audio-copy">Even if it's so light, it's barely visible, it's just shining like, <strong>like a diamond. Like a diamond.</strong></div><div class="wlp-walk-player"><button type="button" class="wlp-walk-play" aria-label="Play the spotted moment">${icons.play}</button><span class="wlp-walk-wave" aria-hidden="true">${feedbackWave(0)}</span><span class="wlp-walk-duration">0:08</span></div></div>
            <div class="wlp-walk-row"><div class="wlp-walk-bubble">Say this one like your confident moment:</div></div>
            <div class="wlp-walk-audio compact"><div class="wlp-walk-player"><button type="button" class="wlp-walk-play" aria-label="Play the confident version">${icons.play}</button><span class="wlp-walk-wave" aria-hidden="true">${feedbackWave(7)}</span><span class="wlp-walk-duration">0:07</span></div></div>
            <div class="wlp-walk-row"><div class="wlp-walk-bubble">Pause before <strong>&ldquo;like a diamond. Like&rdquo;</strong>.</div></div>
            <div class="wlp-walk-audio"><div class="wlp-walk-audio-copy">Even if it's so light, it's barely visible, it's just shining like, <strong>like a diamond. Like a diamond.</strong></div><div class="wlp-walk-player"><button type="button" class="wlp-walk-play" aria-label="Play the improved version">${icons.play}</button><span class="wlp-walk-wave" aria-hidden="true">${feedbackWave(13)}</span><span class="wlp-walk-duration">0:08</span></div></div>
            <div class="wlp-walk-row"><div class="wlp-walk-bubble">Yes. That's it.</div></div>
            <div class="wlp-walk-row"><div class="wlp-walk-bubble">These are your helper words. They'll appear on screen during your next take, to remind you of what you learned here.</div></div>
            <div class="wlp-walk-row"><div class="wlp-walk-bubble"><span class="wlp-walk-helper">like a diamond. Like</span></div></div>
            <div class="wlp-walk-row"><div class="wlp-walk-bubble">Lesson done.</div></div>
          </div></div>
          <div class="wlp-walk-dock"><button type="button" class="wlp-walk-pill dark" data-practice-walk-next>Next</button></div>
        </div>`;
        overlay.querySelector("[data-practice-walk-close]")?.addEventListener("click", () => { closeOverlay(); render(); });
        overlay.querySelector("[data-practice-walk-next]")?.addEventListener("click", openProjectConversationAfterWalk);
      }

      function openOnboarding() {
        onboardingStep = 0;
        onboardingConsent = false;
        onboardingCountry = "";
        setupFeeling = null;
        setupTopic = "";
        setupLength = 300;
        setupLengthOther = false;
        setupCustomMinutes = "";
        setupSlidesAttached = false;
        renderOnboarding();
      }

      function renderOnboarding() {
        overlayState = "onboarding";
        const setupDots = (active) => Array.from({ length: 4 }, (_, i) => `<i class="${i === active ? "active" : i < active ? "done" : ""}"></i>`).join("");
        const setupHeader = (active, back, closeClass = "plain") => `<div class="wlp-setup-progress"><div class="wlp-setup-progress-side">${back ? `<button type="button" class="wlp-setup-back" data-setup-back>&larr; Back</button>` : ""}</div><div class="wlp-setup-dots" aria-label="Setup step ${active + 1} of 4">${setupDots(active)}</div><div class="wlp-setup-progress-side right"><button type="button" class="wlp-setup-close ${closeClass}" data-onboarding-close aria-label="Close">${icons.x}</button></div></div>`;
        const setupHead = (title, helper = "") => `<div class="wlp-setup-head"><h2>${icons.mic}<span>${title}</span></h2>${helper ? `<p>${helper}</p>` : ""}</div>`;
        let content = "";

        if (onboardingStep === 0) {
          content = `<div class="wlp-onboarding-content"><div class="wlp-breath-mark" aria-hidden><span class="wlp-breath-dots"><i></i><i></i><i></i></span></div><h1>WillpowerLab</h1><p>Great presentations aren't about slides.<br>They're about a dream and the guts to deliver it.</p><p>You bring the dream.<br>We'll help you sound brave until you are.</p><div class="wlp-onboarding-actions"><button type="button" class="wlp-onboarding-primary" data-onboarding-next>Enter the lab</button><button type="button" class="wlp-onboarding-secondary" data-onboarding-next>See an example</button></div></div>`;
        } else if (onboardingStep === 1) {
          content = `<div class="wlp-onboarding-content"><div class="wlp-consent-card"><div class="wlp-breath-mark wlp-consent-mark" aria-hidden><span class="wlp-breath-dots"><i></i><i></i><i></i></span></div><p style="text-align:center">By tapping Agree and continue you accept the Terms of Service.</p><div class="wlp-consent-links" style="justify-content:center"><button type="button">Terms of Service</button><button type="button">Privacy Policy</button><button type="button">How AI is used here</button></div><select class="wlp-consent-country" id="wlp-consent-country" aria-label="Country of residence"><option value="" ${onboardingCountry ? "" : "selected"} disabled>Choose your country *</option><option value="PL" ${onboardingCountry === "PL" ? "selected" : ""}>Poland</option><option value="GB" ${onboardingCountry === "GB" ? "selected" : ""}>United Kingdom</option><option value="US" ${onboardingCountry === "US" ? "selected" : ""}>United States</option></select><button type="button" class="wlp-consent-tick${onboardingConsent ? " is-selected" : ""}" id="wlp-consent-tick"><span>${onboardingConsent ? icons.check : ""}</span><b>I agree that WillpowerLab may process my recordings. *</b></button><div class="wlp-onboarding-actions"><button type="button" class="wlp-onboarding-primary" data-consent-continue ${onboardingConsent && onboardingCountry ? "" : "disabled"}>Agree and continue</button><button type="button" class="wlp-onboarding-secondary" data-onboarding-close>Do not agree</button></div></div></div>`;
        } else if (onboardingStep === 2) {
          content = `<div class="wlp-setup-screen"><div class="wlp-picker-header"><h2>What are you recording?</h2><button type="button" class="wlp-setup-close" data-onboarding-close aria-label="Close">${icons.x}</button></div><div class="wlp-picker-content"><button type="button" class="wlp-picker-new" data-picker-new>${icons.plus}<span>Start a new project</span></button><p class="wlp-picker-label">Or another take of:</p><button type="button" class="wlp-picker-row" data-picker-draft><span><strong>lol</strong><em>Draft</em></span><span class="wlp-picker-more" aria-hidden>&middot;&middot;&middot;</span></button><button type="button" class="wlp-picker-row" data-picker-existing><span><strong>testingg</strong></span><span class="wlp-picker-more" aria-hidden>&middot;&middot;&middot;</span></button></div></div>`;
        } else if (onboardingStep === 3) {
          content = `<div class="wlp-setup-screen"><div class="wlp-setup-progress-wrap">${setupHeader(0, false)}</div><div class="wlp-setup-body">${setupHead("How do you feel?", "Before you step on stage")}<div class="wlp-setup-chip-grid">${[["nervous", "Nervous"], ["excited", "Excited"], ["calm", "Calm"], ["unsure", "Not sure"]].map(([key, label]) => `<button type="button" class="wlp-setup-choice${setupFeeling === key ? " is-selected" : ""}" data-feeling="${key}" ${setupFeeling && setupFeeling !== key ? "disabled" : ""} aria-pressed="${setupFeeling === key}">${label}</button>`).join("")}<button type="button" class="wlp-setup-skip" data-feelings-skip ${setupFeeling ? "disabled" : ""}>Skip</button></div></div></div>`;
        } else if (onboardingStep === 4) {
          content = `<div class="wlp-setup-screen"><div class="wlp-setup-progress-wrap">${setupHeader(1, false)}</div><div class="wlp-setup-body">${setupHead("What is the topic?")}<input id="wlp-setup-topic" class="wlp-setup-input" value="${setupTopic.replace(/"/g, "&quot;")}" placeholder="e.g. my Q3 results pitch" aria-label="Topic" autofocus></div><div class="wlp-setup-footer"><button type="button" class="wlp-setup-primary" data-setup-next ${setupTopic.trim() ? "" : "disabled"}>Next</button></div></div>`;
        } else if (onboardingStep === 5) {
          const lengths = [["3 min", 180], ["5 min", 300], ["10 min", 600], ["30 min", 1800], ["60 min", 3600], ["No time limit", 0]];
          const otherReady = !setupLengthOther || Number(setupCustomMinutes) > 0;
          content = `<div class="wlp-setup-screen"><div class="wlp-setup-progress-wrap">${setupHeader(2, true)}</div><div class="wlp-setup-body">${setupHead("Do you have a time limit?")}<div class="wlp-setup-lengths">${lengths.map(([label, seconds]) => `<button type="button" class="wlp-setup-length${!setupLengthOther && setupLength === seconds ? " is-selected" : ""}" data-setup-length="${seconds}" aria-pressed="${!setupLengthOther && setupLength === seconds}">${label}</button>`).join("")}<button type="button" class="wlp-setup-length${setupLengthOther ? " is-selected" : ""}" data-setup-other aria-pressed="${setupLengthOther}">Other</button></div>${setupLengthOther ? `<label class="wlp-setup-other"><input id="wlp-setup-custom-minutes" class="wlp-setup-input" type="number" min="1" step="1" inputmode="numeric" value="${escapeHtml(setupCustomMinutes)}" placeholder="Minutes" aria-label="Other time limit in minutes" autofocus><span>min</span></label>` : ""}</div><div class="wlp-setup-footer"><button type="button" class="wlp-setup-primary" data-setup-next ${otherReady ? "" : "disabled"}>Next</button></div></div>`;
        } else if (onboardingStep === 6) {
          content = `<div class="wlp-setup-screen"><div class="wlp-setup-progress-wrap">${setupHeader(3, true)}</div><div class="wlp-setup-body">${setupHead("Have slides to go with it?")}<button type="button" class="wlp-setup-upload${setupSlidesAttached ? " is-attached" : ""}" data-upload-deck>${setupSlidesAttached ? icons.check : icons.upload}<span>${setupSlidesAttached ? (deck?.attached ? `Generated deck attached &middot; ${deck.final?.slides.length || deck.slides.length} slides` : "Deck attached") : "Upload your deck (PDF)"}</span></button>${setupSlidesAttached ? `<button type="button" class="wlp-setup-replace" data-upload-deck>Replace the deck</button>` : deckgenCta()}</div><div class="wlp-setup-footer"><button type="button" class="wlp-setup-primary" data-setup-finish>${setupSlidesAttached ? "Start recording" : "Skip for now"}</button></div></div>`;
        }

        const isWizard = onboardingStep >= 3;
        overlay.innerHTML = `<div class="${isWizard ? "wlp-setup-overlay" : "wlp-onboarding-overlay"}" role="dialog" aria-modal="true" aria-label="${isWizard ? "Recording setup" : "First-run onboarding"}">${content}</div>`;
        overlay.querySelectorAll("[data-onboarding-close]").forEach((button) => button.addEventListener("click", closeOverlay));
        overlay.querySelectorAll("[data-onboarding-next]").forEach((button) => button.addEventListener("click", () => { onboardingStep = 1; renderOnboarding(); }));
        overlay.querySelector("#wlp-consent-tick")?.addEventListener("click", () => { onboardingConsent = !onboardingConsent; renderOnboarding(); });
        overlay.querySelector("#wlp-consent-country")?.addEventListener("change", (event) => { onboardingCountry = event.target.value; renderOnboarding(); });
        overlay.querySelector("[data-consent-continue]")?.addEventListener("click", () => { onboardingStep = 2; renderOnboarding(); });
        overlay.querySelector("[data-picker-new]")?.addEventListener("click", () => { setupFeeling = null; onboardingStep = 3; renderOnboarding(); });
        overlay.querySelector("[data-picker-draft]")?.addEventListener("click", () => { setupTopic = "lol"; setupFeeling = null; onboardingStep = 3; renderOnboarding(); });
        overlay.querySelector("[data-picker-existing]")?.addEventListener("click", () => { closeOverlay(); current = "project-1"; render(); });
        overlay.querySelectorAll("[data-feeling]").forEach((button) => button.addEventListener("click", () => {
          if (setupFeeling) return;
          setupFeeling = button.getAttribute("data-feeling");
          renderOnboarding();
          window.setTimeout(() => { onboardingStep = 4; renderOnboarding(); }, 450);
        }));
        overlay.querySelector("[data-feelings-skip]")?.addEventListener("click", () => { onboardingStep = 4; renderOnboarding(); });
        const topicInput = overlay.querySelector("#wlp-setup-topic");
        topicInput?.addEventListener("input", () => {
          setupTopic = topicInput.value;
          const next = overlay.querySelector("[data-setup-next]");
          if (next) next.disabled = !setupTopic.trim();
        });
        topicInput?.addEventListener("keydown", (event) => {
          if (event.key === "Enter" && setupTopic.trim()) { event.preventDefault(); onboardingStep = 5; renderOnboarding(); }
        });
        overlay.querySelector("[data-setup-back]")?.addEventListener("click", () => { onboardingStep = Math.max(3, onboardingStep - 1); renderOnboarding(); });
        overlay.querySelector("[data-setup-next]")?.addEventListener("click", () => {
          if (onboardingStep === 4 && !setupTopic.trim()) return;
          if (onboardingStep === 5 && setupLengthOther && !(Number(setupCustomMinutes) > 0)) return;
          onboardingStep = Math.min(6, onboardingStep + 1);
          renderOnboarding();
        });
        overlay.querySelectorAll("[data-setup-length]").forEach((button) => button.addEventListener("click", () => { setupLengthOther = false; setupLength = Number(button.getAttribute("data-setup-length")); renderOnboarding(); }));
        overlay.querySelector("[data-setup-other]")?.addEventListener("click", () => { setupLengthOther = true; setupLength = null; renderOnboarding(); });
        const customMinutes = overlay.querySelector("#wlp-setup-custom-minutes");
        customMinutes?.addEventListener("input", () => {
          setupCustomMinutes = customMinutes.value;
          const next = overlay.querySelector("[data-setup-next]");
          if (next) next.disabled = !(Number(setupCustomMinutes) > 0);
        });
        overlay.querySelectorAll("[data-upload-deck]").forEach((button) => button.addEventListener("click", () => { setupSlidesAttached = true; renderOnboarding(); }));
        overlay.querySelector("[data-deckgen-open]")?.addEventListener("click", openDeckBuilder);
        overlay.querySelector("[data-setup-finish]")?.addEventListener("click", finishRecordingSetup);
      }

      function deckgenCta() {
        const topic = String(setupTopic || "").trim();
        const resume = deck && deck.topic === topic && deck.msgs.length > 2;
        const passName = resume ? { brief: "Brief", structure: "Plan", "visuals-ask": "Slides", visuals: "Slides", style: "Look", final: "Final deck" }[deck.phase] : "";
        const detail = resume ? `${passName}${deck.slides.length ? ` &middot; ${deck.slides.length} slides` : ""} &middot; pick up where you left off` : "Talk it through: I plan it, build it slide by slide, you change anything by voice.";
        return `<div class="wlp-deckgen-or"><span>or</span></div><button type="button" class="wlp-deckgen-cta" data-deckgen-open><span class="wlp-deckgen-cta-mark">${deckIcons.sparkle}</span><span class="wlp-deckgen-cta-copy"><strong>${resume ? "Continue your deck" : "No deck? Generate one"}</strong><small>${detail}</small></span>${icons.arrow}</button>`;
      }

      function finishRecordingSetup() {
        {
          const chat = currentProject();
          const targetMinutes = setupLengthOther ? Number(setupCustomMinutes) : setupLength ? Math.round(setupLength / 60) : null;
          practiceDurationSeconds = 300;
          if (chat) {
            chat.timeLimitMinutes = targetMinutes;
            chat.duration = "5 minutes";
            chat.preview = "Ready for first practice &middot; 5-minute maximum";
            chat.time = "Now";
          }
          practiceMode = "first";
          practiceSlide = 1;
          practiceElapsedSeconds = 0;
          practiceSaved = false;
          openPracticeRecording(chat);
        }
      }

      function openPresentationPreview() {
        presentationSlideIndex = 0;
        presentationTheme = "blue";
        renderPresentationPreview();
      }

        overlayState = "presentation-preview";
        const theme = presentationThemes[presentationTheme] || presentationThemes.blue;

          <header class="wlp-presentation-top"><button type="button" data-presentation-close aria-label="Back">${icons.back}</button><div class="wlp-presentation-heading"><strong>testingg</strong><span>Example presentation - Slides 1-5</span></div><button type="button" data-presentation-close aria-label="Close">${icons.x}</button></header>

            <div class="wlp-presentation-caption">Example presentation preview - try a different background</div>

            <div class="wlp-presentation-themes"><span>Background</span>${Object.entries(presentationThemes).map(([key, value]) => `<button type="button" class="${key === presentationTheme ? "is-selected" : ""}" data-presentation-theme="${key}" aria-label="${value.label} background" aria-pressed="${key === presentationTheme}"><span class="wlp-presentation-theme-dot ${key}"></span></button>`).join("")}</div>

        overlay.querySelector("[data-presentation-prev]")?.addEventListener("click", () => { presentationSlideIndex = Math.max(0, presentationSlideIndex - 1); renderPresentationPreview(); });

        overlay.querySelectorAll("[data-presentation-theme]").forEach((button) => button.addEventListener("click", () => { presentationTheme = button.getAttribute("data-presentation-theme") || "blue"; renderPresentationPreview(); }));
      }

      function openIdealText() {
        idealMenuOpen = false;
        idealCopied = false;
        renderIdealText();
      }

      function continueAfterIdeal(chat, targetSlide) {
        const safeTarget = Math.max(1, Math.min(practiceSlides.length, targetSlide));
        const target = practiceSlides[safeTarget - 1];
        practiceMode = "continue";
        practiceSlide = safeTarget;
        practiceSaved = false;
        practiceElapsedSeconds = 0;
        if (chat) {
          chat.trainingState = "paused";
          chat.paused = true;

      function renderIdealText() {
        overlayState = "ideal-text";

        const fragmentStart = Math.max(1, Number(chat?.idealFragmentStart || practiceSlide));
        const fragmentEnd = Math.min(practiceSlides.length, Math.max(fragmentStart, Number(chat?.idealFragmentEnd || practiceSlide)));
        const visibleFragments = practiceFragments.slice(fragmentStart - 1, fragmentEnd);
        const canContinue = fragmentEnd < practiceSlides.length;
        overlay.innerHTML = `<div class="wlp-ideal-overlay" role="dialog" aria-modal="true" aria-label="Your ideal text">

          <div class="wlp-ideal-page-body">
            ${visibleFragments.map((fragment, offset) => {

                ? `<div class="wlp-ideal-slide-orange"><span class="wlp-slide-line"></span><strong>${slide.name}</strong><span class="wlp-orange-numbers">${slide.numbers.map((number) => `<i>${number}</i>`).join("")}</span></div>`

              return `<section class="wlp-ideal-fragment">${visual}<div class="wlp-ideal-copy"><p><strong>Slide ${slideNumber} &middot; ${fragment.name}</strong>${fragment.text}</p></div></section>`;
