<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="700" fill="#FBF8F4"/>

  <text x="50" y="60" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="600" fill="#1A1714">WillpowerLab — locked logo system</text>
  <text x="50" y="90" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#6B6562">The Reticle. Orange #F97316. Wordmark Inter Semibold #1A1714.</text>

  <!-- Primary mark -->
  <text x="50" y="155" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#1A1714">Primary mark</text>
  <rect x="50" y="170" width="160" height="160" fill="#FFFFFF" stroke="#E5DFD7" stroke-width="1"/>
  <g transform="translate(80, 200)">
    <circle cx="50" cy="50" r="32" fill="none" stroke="#F97316" stroke-width="4"/>
    <line x1="50" y1="8" x2="50" y2="28" stroke="#F97316" stroke-width="4" stroke-linecap="round"/>
    <line x1="50" y1="72" x2="50" y2="92" stroke="#F97316" stroke-width="4" stroke-linecap="round"/>
    <line x1="8" y1="50" x2="28" y2="50" stroke="#F97316" stroke-width="4" stroke-linecap="round"/>
    <line x1="72" y1="50" x2="92" y2="50" stroke="#F97316" stroke-width="4" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="5" fill="#F97316"/>
  </g>

  <!-- Favicon -->
  <text x="240" y="155" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#1A1714">Favicon (&#8804;24px)</text>
  <rect x="240" y="170" width="160" height="160" fill="#FFFFFF" stroke="#E5DFD7" stroke-width="1"/>
  <g transform="translate(270, 200)">
    <circle cx="50" cy="50" r="36" fill="none" stroke="#F97316" stroke-width="8"/>
    <circle cx="50" cy="50" r="10" fill="#F97316"/>
  </g>

  <!-- App icon light -->
  <text x="430" y="155" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#1A1714">App icon — light</text>
  <g transform="translate(430, 170)">
    <rect width="160" height="160" rx="35" fill="#FBF8F4" stroke="#E5DFD7" stroke-width="1"/>
    <g transform="translate(30, 30)">
      <circle cx="50" cy="50" r="32" fill="none" stroke="#F97316" stroke-width="5"/>
      <line x1="50" y1="8" x2="50" y2="28" stroke="#F97316" stroke-width="5" stroke-linecap="round"/>
      <line x1="50" y1="72" x2="50" y2="92" stroke="#F97316" stroke-width="5" stroke-linecap="round"/>
      <line x1="8" y1="50" x2="28" y2="50" stroke="#F97316" stroke-width="5" stroke-linecap="round"/>
      <line x1="72" y1="50" x2="92" y2="50" stroke="#F97316" stroke-width="5" stroke-linecap="round"/>
      <circle cx="50" cy="50" r="6" fill="#F97316"/>
    </g>
  </g>

  <!-- App icon dark -->
  <text x="620" y="155" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#1A1714">App icon — dark</text>
  <g transform="translate(620, 170)">
    <rect width="160" height="160" rx="35" fill="#1A1714"/>
    <g transform="translate(30, 30)">
      <circle cx="50" cy="50" r="32" fill="none" stroke="#F97316" stroke-width="5"/>
      <line x1="50" y1="8" x2="50" y2="28" stroke="#F97316" stroke-width="5" stroke-linecap="round"/>
      <line x1="50" y1="72" x2="50" y2="92" stroke="#F97316" stroke-width="5" stroke-linecap="round"/>
      <line x1="8" y1="50" x2="28" y2="50" stroke="#F97316" stroke-width="5" stroke-linecap="round"/>
      <line x1="72" y1="50" x2="92" y2="50" stroke="#F97316" stroke-width="5" stroke-linecap="round"/>
      <circle cx="50" cy="50" r="6" fill="#F97316"/>
    </g>
  </g>

  <!-- Horizontal lockup -->
  <text x="50" y="385" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#1A1714">Horizontal lockup (default)</text>
  <rect x="50" y="400" width="800" height="120" fill="#FFFFFF" stroke="#E5DFD7" stroke-width="1"/>
  <g transform="translate(80, 410)">
    <g transform="translate(0, 10)">
      <circle cx="50" cy="50" r="32" fill="none" stroke="#F97316" stroke-width="4"/>
      <line x1="50" y1="8" x2="50" y2="28" stroke="#F97316" stroke-width="4" stroke-linecap="round"/>
      <line x1="50" y1="72" x2="50" y2="92" stroke="#F97316" stroke-width="4" stroke-linecap="round"/>
      <line x1="8" y1="50" x2="28" y2="50" stroke="#F97316" stroke-width="4" stroke-linecap="round"/>
      <line x1="72" y1="50" x2="92" y2="50" stroke="#F97316" stroke-width="4" stroke-linecap="round"/>
      <circle cx="50" cy="50" r="5" fill="#F97316"/>
    </g>
    <text x="120" y="78" font-family="Inter, system-ui, sans-serif" font-size="50" font-weight="600" fill="#1A1714" letter-spacing="-1.2">WillpowerLab</text>
  </g>

  <!-- Stacked lockup -->
  <text x="50" y="565" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#1A1714">Stacked lockup (square placements)</text>
  <rect x="50" y="580" width="280" height="100" fill="#FFFFFF" stroke="#E5DFD7" stroke-width="1"/>
  <g transform="translate(165, 590)">
    <g transform="scale(0.4)">
      <circle cx="50" cy="50" r="32" fill="none" stroke="#F97316" stroke-width="4"/>
      <line x1="50" y1="8" x2="50" y2="28" stroke="#F97316" stroke-width="4" stroke-linecap="round"/>
      <line x1="50" y1="72" x2="50" y2="92" stroke="#F97316" stroke-width="4" stroke-linecap="round"/>
      <line x1="8" y1="50" x2="28" y2="50" stroke="#F97316" stroke-width="4" stroke-linecap="round"/>
      <line x1="72" y1="50" x2="92" y2="50" stroke="#F97316" stroke-width="4" stroke-linecap="round"/>
      <circle cx="50" cy="50" r="5" fill="#F97316"/>
    </g>
  </g>
  <text x="190" y="665" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600" fill="#1A1714" letter-spacing="-0.5">WillpowerLab</text>

  <!-- Dark example -->
  <g transform="translate(370, 580)">
    <rect width="280" height="100" fill="#1A1714"/>
    <g transform="translate(115, 10)">
      <g transform="scale(0.4)">
        <circle cx="50" cy="50" r="32" fill="none" stroke="#F97316" stroke-width="4"/>
        <line x1="50" y1="8" x2="50" y2="28" stroke="#F97316" stroke-width="4" stroke-linecap="round"/>
        <line x1="50" y1="72" x2="50" y2="92" stroke="#F97316" stroke-width="4" stroke-linecap="round"/>
        <line x1="8" y1="50" x2="28" y2="50" stroke="#F97316" stroke-width="4" stroke-linecap="round"/>
        <line x1="72" y1="50" x2="92" y2="50" stroke="#F97316" stroke-width="4" stroke-linecap="round"/>
        <circle cx="50" cy="50" r="5" fill="#F97316"/>
      </g>
    </g>
    <text x="140" y="85" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600" fill="#FBF8F4" letter-spacing="-0.5">WillpowerLab</text>
  </g>
</svg>
