<svg viewBox="0 0 900 1100" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="1100" fill="#FBF8F4"/>

  <text x="50" y="60" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="600" fill="#1A1714">WillpowerLab — round two: single-color precision marks</text>
  <text x="50" y="90" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#6B6562">One color (#F97316). Sniper + peace-sign family. Lab-coded, B2B-credible.</text>

  <!-- Row 1: Reticle -->
  <text x="50" y="155" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#1A1714">05 — The Reticle  ★ recommended</text>
  <text x="50" y="180" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#6B6562">Crosshair + center dot. Sniper-precision, single color, scales perfectly to favicon.</text>
  <g transform="translate(50, 200)">
    <rect width="120" height="120" fill="#FFFFFF" stroke="#E5DFD7" stroke-width="1"/>
    <g transform="translate(10, 10)">
      <circle cx="50" cy="50" r="32" fill="none" stroke="#F97316" stroke-width="4"/>
      <line x1="50" y1="8" x2="50" y2="28" stroke="#F97316" stroke-width="4" stroke-linecap="round"/>
      <line x1="50" y1="72" x2="50" y2="92" stroke="#F97316" stroke-width="4" stroke-linecap="round"/>
      <line x1="8" y1="50" x2="28" y2="50" stroke="#F97316" stroke-width="4" stroke-linecap="round"/>
      <line x1="72" y1="50" x2="92" y2="50" stroke="#F97316" stroke-width="4" stroke-linecap="round"/>
      <circle cx="50" cy="50" r="5" fill="#F97316"/>
    </g>
  </g>
  <g transform="translate(200, 200)">
    <rect width="650" height="120" fill="#FFFFFF" stroke="#E5DFD7" stroke-width="1"/>
    <g transform="translate(15, 22)">
      <circle cx="40" cy="40" r="26" fill="none" stroke="#F97316" stroke-width="3.5"/>
      <line x1="40" y1="6" x2="40" y2="22" stroke="#F97316" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="40" y1="58" x2="40" y2="74" stroke="#F97316" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="6" y1="40" x2="22" y2="40" stroke="#F97316" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="58" y1="40" x2="74" y2="40" stroke="#F97316" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="40" cy="40" r="4" fill="#F97316"/>
    </g>
    <text x="115" y="76" font-family="Inter, system-ui, sans-serif" font-size="46" font-weight="600" fill="#1A1714" letter-spacing="-1">WillpowerLab</text>
  </g>

  <!-- Row 2: Bullseye -->
  <text x="50" y="375" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#1A1714">06 — The Bullseye</text>
  <text x="50" y="400" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#6B6562">Concentric rings + center fill. Closest to a peace-sign aesthetic; pure target metaphor.</text>
  <g transform="translate(50, 420)">
    <rect width="120" height="120" fill="#FFFFFF" stroke="#E5DFD7" stroke-width="1"/>
    <g transform="translate(10, 10)">
      <circle cx="50" cy="50" r="38" fill="none" stroke="#F97316" stroke-width="4"/>
      <circle cx="50" cy="50" r="22" fill="none" stroke="#F97316" stroke-width="4"/>
      <circle cx="50" cy="50" r="8" fill="#F97316"/>
    </g>
  </g>
  <g transform="translate(200, 420)">
    <rect width="650" height="120" fill="#FFFFFF" stroke="#E5DFD7" stroke-width="1"/>
    <g transform="translate(15, 22)">
      <circle cx="40" cy="40" r="30" fill="none" stroke="#F97316" stroke-width="3.5"/>
      <circle cx="40" cy="40" r="18" fill="none" stroke="#F97316" stroke-width="3.5"/>
      <circle cx="40" cy="40" r="6" fill="#F97316"/>
    </g>
    <text x="115" y="76" font-family="Inter, system-ui, sans-serif" font-size="46" font-weight="600" fill="#1A1714" letter-spacing="-1">WillpowerLab</text>
  </g>

  <!-- Row 3: Tuning Fork -->
  <text x="50" y="595" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#1A1714">07 — The Tuning Fork</text>
  <text x="50" y="620" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#6B6562">Literal lab instrument for measuring pitch. Speech + measurement in one form.</text>
  <g transform="translate(50, 640)">
    <rect width="120" height="120" fill="#FFFFFF" stroke="#E5DFD7" stroke-width="1"/>
    <g transform="translate(10, 10)">
      <path d="M 32 18 L 32 58 Q 32 72, 50 72 Q 68 72, 68 58 L 68 18" fill="none" stroke="#F97316" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="50" y1="72" x2="50" y2="88" stroke="#F97316" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>
  <g transform="translate(200, 640)">
    <rect width="650" height="120" fill="#FFFFFF" stroke="#E5DFD7" stroke-width="1"/>
    <g transform="translate(15, 22)">
      <path d="M 26 14 L 26 46 Q 26 58, 40 58 Q 54 58, 54 46 L 54 14" fill="none" stroke="#F97316" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="40" y1="58" x2="40" y2="70" stroke="#F97316" stroke-width="5.5" stroke-linecap="round"/>
    </g>
    <text x="115" y="76" font-family="Inter, system-ui, sans-serif" font-size="46" font-weight="600" fill="#1A1714" letter-spacing="-1">WillpowerLab</text>
  </g>

  <!-- Row 4: Dial -->
  <text x="50" y="815" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#1A1714">08 — The Dial</text>
  <text x="50" y="840" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#6B6562">Calibration dial with a needle. Closest to the in-product wheel; reads as &#x201C;measurement.&#x201D;</text>
  <g transform="translate(50, 860)">
    <rect width="120" height="120" fill="#FFFFFF" stroke="#E5DFD7" stroke-width="1"/>
    <g transform="translate(10, 10)">
      <circle cx="50" cy="50" r="38" fill="none" stroke="#F97316" stroke-width="4"/>
      <line x1="50" y1="14" x2="50" y2="86" stroke="#F97316" stroke-width="4" stroke-linecap="round"/>
      <line x1="50" y1="50" x2="80" y2="35" stroke="#F97316" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
  <g transform="translate(200, 860)">
    <rect width="650" height="120" fill="#FFFFFF" stroke="#E5DFD7" stroke-width="1"/>
    <g transform="translate(15, 22)">
      <circle cx="40" cy="40" r="30" fill="none" stroke="#F97316" stroke-width="3.5"/>
      <line x1="40" y1="11" x2="40" y2="69" stroke="#F97316" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="40" y1="40" x2="64" y2="28" stroke="#F97316" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <text x="115" y="76" font-family="Inter, system-ui, sans-serif" font-size="46" font-weight="600" fill="#1A1714" letter-spacing="-1">WillpowerLab</text>
  </g>

  <text x="50" y="1040" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B6562">All marks single-color (#F97316). Wordmark in warm ink #1A1714 on cream background.</text>
</svg>
