name: tests

# The FE's first CI gate (testing-strategy overhaul). Three tiers:
#
#   unit — vitest (935 cases), next lint, tsc --noEmit. All three were green
#          at the commit that introduced this gate; a red here is a NEW
#          defect, not environmental noise. BLOCKING.
#
#   e2e  — the five self-contained real-browser specs against `next dev`
#          (see e2e/README.md; record-flow needs a live backend and is not
#          run here). NON-BLOCKING (continue-on-error) for an observation
#          period — real-browser timing can flake in CI, and a gate that
#          cries wolf gets ignored. Flip it blocking once it has a quiet
#          track record.
#
#   csp  — one real-browser spec against a PRODUCTION build, asserting the
#          Content-Security-Policy blocks nothing the app actually loads.
#          BLOCKING from the start, unlike e2e: this tier exists because #242
#          shipped a policy that broke every route, and it passed a green
#          build, a green unit tier and a hand audit of the rendered HTML.
#          The stylesheet it blocked is written at RUNTIME by a dependency,
#          so a browser is the only thing that can see it. A flake here costs
#          a re-run; a miss here costs a total outage.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vitest
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      # One BFF idiom (handoff §C3.4): no new direct backend fetch outside
      # src/app/api/_lib/backend.ts. Ratchet — the baseline shrinks as route
      # batches migrate to callBackend.
      - name: BFF single-idiom guard
        run: npm run check:bff

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start next dev and warm the harness pages
        env:
          # The harness contract (e2e/README.md): the star-verdicts fixture
          # seeds an sb-dummy-* auth cookie, so the URL's project ref MUST
          # be "dummy". Placeholders only — nothing connects to them.
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
        run: |
          npx next dev -p 3111 > /tmp/nextdev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3111/ && break
            sleep 2
          done
          # First-compile warmup: a spec that navigates mid-compile races
          # its own selectors. Compile each harness page before any spec.
          for p in dev/life-bets dev/corpus dev/game dev/star-verdicts dev/marked-editor dev/deck; do
            curl -sf -o /dev/null "http://localhost:3111/$p" || true
          done

      - name: Run the self-contained specs
        run: |
          node e2e/bets-reorder.spec.mjs
          node e2e/corpus.spec.mjs
          node e2e/game.spec.mjs
          node e2e/star-verdicts.spec.mjs
          node e2e/deck.spec.mjs
          MARKED_URL=http://localhost:3111/dev/marked-editor node e2e/marked-editor.spec.mjs

      - name: Dev-server log on failure
        if: failure()
        run: tail -50 /tmp/nextdev.log

  csp:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # A PRODUCTION build on purpose, not `next dev`: script-src carries
      # 'unsafe-eval' only in dev, and dev injects styles for HMR that
      # production never ships — so dev would both miss the real policy and
      # report violations users never meet. Env values are placeholders in the
      # same shape the e2e tier uses; nothing connects to them, and the build
      # only needs them to be present.
      - name: Build and start the production server
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          NEXT_PUBLIC_API_URL: https://api.example.invalid
          OPENAI_API_KEY: sk-dummy-never-called
        run: |
          npx next build
          npx next start -p 3140 > /tmp/nextstart.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3140/ && break
            sleep 2
          done

      - name: CSP violations in a real browser
        run: BASE_URL=http://localhost:3140 node e2e/csp-violations.spec.mjs

      - name: Server log on failure
        if: failure()
        run: tail -50 /tmp/nextstart.log
