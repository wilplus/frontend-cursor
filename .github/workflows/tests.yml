name: tests

# The FE's first CI gate (testing-strategy overhaul). Three tiers:
#
#   unit — vitest (935 cases), next lint, tsc --noEmit. All three were green
#          at the commit that introduced this gate; a red here is a NEW
#          defect, not environmental noise. BLOCKING. Since 2026-10-07 it
#          also runs the design-lock guard (build plan X5): a commit on the
#          PR that changes a founder-locked screen's file without a
#          `Founder-Approved:` trailer is red.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # The design-lock guard reads the trailers of every commit on the
          # PR, so it needs the history and the base, not a depth-1 checkout.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vitest
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      # One BFF idiom (handoff §C3.4): no new direct backend fetch outside
      # src/app/api/_lib/backend.ts. Ratchet — the baseline shrinks as route
      # batches migrate to callBackend.
      - name: BFF single-idiom guard
        run: npm run check:bff

      # Cyclomatic complexity ratchet (audit Q-C7, 2026-09-14): no function
      # under src/ over CC 25 unless frozen in scripts/complexity-baseline.json,
      # and a frozen one may only come down.
      - name: Complexity ratchet
        run: npm run check:complexity

      # Design-lock guard (build plan X5, 2026-10-07): the files behind the
      # founder-locked screens (scripts/design-locked-files.txt) change only
      # with a `Founder-Approved:` trailer on the commit. Compares against
      # origin/main.
      - name: Fetch the base for the design-lock guard
        run: git fetch --no-tags origin +main:refs/remotes/origin/main

      - name: Design-lock guard
        run: npm run check:design-lock
